<style>
/* ============================================================
   Recall · Finals Trainer
   Mobile-first, offline, no external dependencies.
   ============================================================ */

:root{
  --bg:#0f1226;
  --bg-2:#15193a;
  --surface:#1b2046;
  --surface-2:#222a59;
  --line:rgba(255,255,255,.10);
  --line-strong:rgba(255,255,255,.18);
  --text:#eef1ff;
  --text-dim:#aab0d8;
  --text-faint:#7a82ad;
  --accent:#6c5ce7;
  --accent-soft:rgba(108,92,231,.16);
  --good:#27c89b;
  --good-soft:rgba(39,200,155,.15);
  --bad:#ff6b81;
  --bad-soft:rgba(255,107,129,.15);
  --warn:#ffb648;
  --shadow:0 10px 30px -12px rgba(0,0,0,.6);
  --radius:18px;
  --radius-sm:12px;
  --maxw:760px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
[data-theme="light"]{
  --bg:#f4f5fb;
  --bg-2:#eceef8;
  --surface:#ffffff;
  --surface-2:#f6f7fc;
  --line:rgba(20,22,50,.10);
  --line-strong:rgba(20,22,50,.18);
  --text:#181a33;
  --text-dim:#4d5378;
  --text-faint:#8a90b4;
  --accent-soft:rgba(108,92,231,.12);
  --shadow:0 10px 30px -16px rgba(30,34,80,.35);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:var(--font);
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(108,92,231,.18), transparent 60%),
    var(--bg);
  color:var(--text);
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  min-height:100dvh;
  padding-bottom:env(safe-area-inset-bottom);
}
[data-theme="light"] body{
  background:radial-gradient(1100px 600px at 50% -10%, rgba(108,92,231,.10), transparent 60%), var(--bg);
}
a{color:inherit}
button{font-family:inherit}
::selection{background:var(--accent-soft)}

/* layout shell */
#app{max-width:var(--maxw);margin:0 auto;padding:18px 16px 90px;}
.row{display:flex;gap:12px;align-items:center}
.row.wrap{flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--text-dim)}
.faint{color:var(--text-faint)}
.center{text-align:center}
.hidden{display:none!important}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.02em;font-size:1.15rem}
.brand .logo{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,#6c5ce7,#a363f7);
  display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 6px 16px -6px rgba(108,92,231,.8)}
.iconbtn{
  appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--text);
  width:40px;height:40px;border-radius:11px;display:grid;place-items:center;cursor:pointer;font-size:1.1rem;
  transition:.15s;
}
.iconbtn:hover{border-color:var(--line-strong);background:var(--surface-2)}

/* ---------- hero / greeting ---------- */
.hero{margin:6px 2px 20px}
.hero h1{font-size:1.7rem;line-height:1.15;letter-spacing:-.03em;margin:.1em 0 .15em}
.hero p{margin:0;color:var(--text-dim)}
.countdown{display:inline-flex;gap:6px;align-items:center;font-weight:600;color:var(--warn);
  background:rgba(255,182,72,.12);border:1px solid rgba(255,182,72,.25);padding:4px 10px;border-radius:999px;font-size:.85rem;margin-top:10px}

/* ---------- streak / stat chips ---------- */
.chips{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 4px}
.chip{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);
  border-radius:13px;padding:9px 13px;font-size:.85rem}
.chip b{font-size:1.05rem}
.chip .k{color:var(--text-faint);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}

/* ---------- buttons ---------- */
.btn{
  appearance:none;cursor:pointer;border:1px solid var(--line-strong);
  background:var(--surface);color:var(--text);
  border-radius:13px;padding:13px 16px;font-size:1rem;font-weight:600;
  display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:.15s;
  -webkit-tap-highlight-color:transparent;
}
.btn:hover{background:var(--surface-2);border-color:var(--line-strong)}
.btn:active{transform:translateY(1px)}
.btn.full{width:100%}
.btn.primary{background:linear-gradient(135deg,var(--accent),#8a6cf0);border-color:transparent;color:#fff;
  box-shadow:0 10px 22px -12px rgba(108,92,231,.9)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.good{background:var(--good);border-color:transparent;color:#04231b}
.btn.sm{padding:8px 12px;font-size:.85rem;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* big action grid on home */
.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:18px 0 6px}
.action{
  text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--radius-sm);color:var(--text);
  padding:15px;cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:3px;min-height:84px;
}
.action:hover{border-color:var(--accent);background:var(--surface-2);transform:translateY(-2px)}
.action .ic{font-size:1.4rem}
.action .t{font-weight:700}
.action .d{font-size:.8rem;color:var(--text-dim)}
.action.wide{grid-column:1 / -1;flex-direction:row;align-items:center;gap:14px;min-height:0}
.action.wide .ic{font-size:1.6rem}

/* ---------- section headers ---------- */
.sec-h{display:flex;align-items:baseline;gap:10px;margin:26px 2px 12px}
.sec-h h2{font-size:1.05rem;letter-spacing:-.01em;margin:0}
.sec-h .hint{color:var(--text-faint);font-size:.8rem}

/* ---------- subject cards ---------- */
.subjects{display:grid;gap:13px}
.subject{
  position:relative;display:flex;align-items:center;gap:15px;cursor:pointer;
  border:1px solid var(--line);border-radius:var(--radius);padding:15px 16px;
  background:
    linear-gradient(90deg, color-mix(in srgb, var(--sub) 16%, transparent), transparent 55%),
    var(--surface);
  transition:.16s;overflow:hidden;
}
.subject:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--sub) 60%, var(--line));box-shadow:var(--shadow)}
.subject .badge{
  width:52px;height:52px;border-radius:15px;flex:none;display:grid;place-items:center;font-size:1.6rem;
  background:color-mix(in srgb,var(--sub) 22%, var(--surface-2));border:1px solid color-mix(in srgb,var(--sub) 35%, transparent);
}
.subject .info{flex:1;min-width:0}
.subject .info h3{margin:0;font-size:1.08rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.subject .info .meta{color:var(--text-dim);font-size:.82rem;margin-top:2px}
.subject .prog{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.weight-dots{display:flex;gap:3px}
.weight-dots i{width:6px;height:6px;border-radius:50%;background:color-mix(in srgb,var(--sub) 75%, transparent)}
.weight-dots i.off{background:var(--line-strong)}
.due-pill{font-size:.72rem;font-weight:700;color:var(--warn);background:rgba(255,182,72,.12);
  border:1px solid rgba(255,182,72,.25);padding:2px 8px;border-radius:999px}

/* exam finished (marked done or graded): de-emphasized but still clickable */
.subject.done{opacity:.66;filter:saturate(.7)}
.subject.done:hover{opacity:1;filter:none}
.subject.done .badge{filter:grayscale(.35)}
.exam-tag{font-size:.62rem;font-weight:800;letter-spacing:.02em;text-transform:uppercase;
  color:var(--good);background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 30%, transparent);
  padding:2px 7px;border-radius:999px;white-space:nowrap}
.ring.done{background:conic-gradient(var(--good) calc(var(--p)*1%), var(--line) 0)}
.ring.done .inner{color:var(--good)}

/* geometry formula sheet */
.fs-h{font-weight:800;font-size:.98rem;color:var(--sub,var(--accent));margin-bottom:6px;letter-spacing:-.01em}
.fs-row{display:flex;justify-content:space-between;gap:14px;align-items:baseline;padding:7px 0;border-top:1px solid var(--line)}
.fs-row:first-of-type{border-top:none}
.fs-name{color:var(--text-dim);font-size:.86rem;flex:1 1 40%;min-width:0}
.fs-form{font-family:var(--mono);font-size:.92rem;text-align:right;flex:1 1 55%;color:var(--text)}

/* geometry figures (inline SVG diagrams in lessons) */
.visual svg{display:block;width:100%;max-width:360px;height:auto;margin:4px auto 0}
.gfig{background:#0e1530;border:1px solid var(--line);border-radius:12px;padding:10px 8px}
.gfig text{font-family:system-ui,-apple-system,sans-serif}

/* ring progress */
.ring{--p:0;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:conic-gradient(var(--sub,var(--accent)) calc(var(--p)*1%), var(--line) 0);
}
.ring .inner{width:36px;height:36px;border-radius:50%;background:var(--surface);display:grid;place-items:center;
  font-size:.72rem;font-weight:800}

/* ---------- generic card / panel ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:14px;margin:12px 0}

/* ---------- topic list ---------- */
.topic{
  display:flex;align-items:center;gap:13px;cursor:pointer;border:1px solid var(--line);
  border-radius:14px;padding:13px 14px;background:var(--surface);transition:.15s;margin-bottom:10px;
}
.topic:hover{border-color:var(--sub,var(--accent));background:var(--surface-2)}
.topic .n{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;font-weight:700;
  background:var(--surface-2);color:var(--text-dim);font-size:.85rem}
.topic .tt{flex:1;min-width:0}
.topic .tt h4{margin:0;font-size:1rem;font-weight:650}
.topic .tt p{margin:1px 0 0;font-size:.8rem;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topic .state{flex:none;font-size:1.1rem;width:26px;text-align:center}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:7px}
.bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--sub,var(--accent)),color-mix(in srgb,var(--sub,var(--accent)) 40%,#fff));border-radius:999px;transition:width .5s}

/* ---------- lesson content ---------- */
.lesson h3.lh{font-size:1.05rem;margin:18px 0 8px;letter-spacing:-.01em;color:var(--text)}
.lesson h3.lh:first-child{margin-top:0}
.lesson p{margin:0 0 11px;color:var(--text)}
.lesson p.note{color:var(--text-dim);font-size:.9rem}
.lesson ul{margin:0 0 12px;padding-left:20px}
.lesson li{margin:4px 0}
.lesson strong, .lesson b{color:var(--text);font-weight:700}
.deflist{display:grid;gap:9px;margin:6px 0 14px}
.def{border-left:3px solid var(--sub,var(--accent));background:var(--surface-2);border-radius:0 10px 10px 0;padding:9px 13px}
.def .term{font-weight:700}
.def .d{color:var(--text-dim);font-size:.92rem}
.example{background:var(--accent-soft);border:1px dashed color-mix(in srgb,var(--sub,var(--accent)) 50%, var(--line));
  border-radius:10px;padding:9px 12px;margin:6px 0 12px;font-style:italic}
.example .lbl{font-style:normal;font-weight:700;font-size:.72rem;text-transform:uppercase;letter-spacing:.05em;color:var(--sub,var(--accent));display:block;margin-bottom:2px}
.tip{display:flex;gap:9px;background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 30%, transparent);
  border-radius:10px;padding:10px 12px;margin:8px 0 14px;font-size:.9rem}
.tip .i{flex:none}

/* ---------- visuals ---------- */
.visual{margin:14px 0 8px;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface-2);overflow:auto}
.visual .vcap{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--text-faint);margin-bottom:10px;font-weight:700}
table.vt{border-collapse:collapse;width:100%;font-size:.9rem}
table.vt th,table.vt td{border:1px solid var(--line-strong);padding:8px 10px;text-align:left;vertical-align:top}
table.vt th{background:color-mix(in srgb,var(--sub,var(--accent)) 18%, transparent);font-weight:700}
table.vt tr:nth-child(even) td{background:rgba(255,255,255,.02)}
[data-theme="light"] table.vt tr:nth-child(even) td{background:rgba(20,22,50,.02)}

.flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:8px}
.flow .step{flex:1;min-width:92px;background:var(--surface);border:1px solid var(--line-strong);border-radius:11px;padding:10px;text-align:center;position:relative}
.flow .step .si{font-size:1.3rem}
.flow .step .sn{font-weight:700;font-size:.88rem;margin-top:2px}
.flow .step .sd{font-size:.74rem;color:var(--text-dim)}
.flow .arrow{align-self:center;color:var(--text-faint);font-weight:700}

.compare{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.compare .col{background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;padding:12px}
.compare .col h5{margin:0 0 8px;font-size:.95rem}
.compare .col ul{margin:0;padding-left:18px;font-size:.86rem}
.compare .col li{margin:4px 0}

.concept{display:flex;flex-direction:column;align-items:center;gap:10px}
.concept .hubn{background:var(--sub,var(--accent));color:#fff;font-weight:700;padding:8px 16px;border-radius:999px}
.concept .leaves{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.concept .leaf{background:var(--surface);border:1px solid var(--line-strong);border-radius:11px;padding:9px 12px;max-width:220px}
.concept .leaf b{display:block;font-size:.9rem}
.concept .leaf span{font-size:.78rem;color:var(--text-dim)}

.tline{position:relative;padding-left:20px}
.tline::before{content:"";position:absolute;left:6px;top:4px;bottom:4px;width:2px;background:var(--line-strong)}
.tline .tev{position:relative;margin-bottom:13px}
.tline .tev::before{content:"";position:absolute;left:-17px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--sub,var(--accent));box-shadow:0 0 0 3px var(--surface-2)}
.tline .tev .td{font-weight:700;font-size:.85rem;color:var(--sub,var(--accent))}
.tline .tev .tx{font-size:.86rem;color:var(--text-dim)}
.visual svg{max-width:100%;height:auto;display:block;margin:0 auto}
.svglabel{font-size:11px;fill:var(--text);font-family:var(--font)}

/* ---------- quiz ---------- */
.q-shell{}
.q-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.q-progress{flex:1;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.q-progress > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#8a6cf0);transition:width .35s}
.q-count{font-size:.8rem;color:var(--text-dim);font-weight:600;white-space:nowrap}
.q-kicker{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--accent);font-weight:800;margin-bottom:6px}
.q-stem{font-size:1.18rem;font-weight:650;letter-spacing:-.01em;margin:0 0 16px}
.q-fig{margin:2px 0 14px;display:flex;justify-content:center}
.q-fig svg{width:100%;max-width:300px;height:auto;display:block;border:1px solid var(--line,#e6e8f0);border-radius:14px;background:#f7f8fc}
.choices{display:grid;gap:10px}
.choice{
  text-align:left;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--text);
  border-radius:13px;padding:13px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start;transition:.12s;font-size:1rem;
}
.choice:hover:not(:disabled){border-color:var(--accent);background:var(--surface-2)}
.choice .key{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;font-weight:700;
  background:var(--surface-2);border:1px solid var(--line-strong);font-size:.85rem;color:var(--text-dim)}
.choice.correct{border-color:var(--good);background:var(--good-soft)}
.choice.correct .key{background:var(--good);color:#04231b;border-color:transparent}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.choice.wrong .key{background:var(--bad);color:#2a0410;border-color:transparent}
.choice:disabled{cursor:default}
.choice.dim{opacity:.55}

.fill-in{display:flex;gap:10px;flex-wrap:wrap}
.fill-in input{flex:1;min-width:180px;font-size:1.05rem;padding:13px 14px;border-radius:12px;
  border:1.5px solid var(--line-strong);background:var(--surface);color:var(--text)}
.fill-in input:focus{outline:none;border-color:var(--accent)}
.fill-in input.correct{border-color:var(--good);background:var(--good-soft)}
.fill-in input.wrong{border-color:var(--bad);background:var(--bad-soft)}

/* flashcard */
.flash{perspective:1200px;margin:6px 0 16px}
.flash .inner{position:relative;min-height:200px;border-radius:16px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.flash.flipped .inner{transform:rotateY(180deg)}
.flash .face{position:absolute;inset:0;backface-visibility:hidden;border:1px solid var(--line-strong);border-radius:16px;
  padding:22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:var(--surface)}
.flash .back{transform:rotateY(180deg);background:var(--surface-2)}
.flash .face .lbl{position:absolute;top:12px;left:14px;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text-faint);font-weight:700}
.flash .face .ct{font-size:1.15rem;font-weight:600}
.flash .face .hint{margin-top:10px;font-size:.85rem;color:var(--text-faint)}
.flash-hint{text-align:center;color:var(--text-faint);font-size:.82rem;margin-top:-8px}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.rate button{padding:11px 6px;border-radius:11px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);cursor:pointer;font-weight:650;font-size:.85rem}
.rate button small{display:block;font-weight:500;font-size:.68rem;color:var(--text-faint)}
.rate button.again:hover{border-color:var(--bad);background:var(--bad-soft)}
.rate button.hard:hover{border-color:var(--warn)}
.rate button.good:hover{border-color:var(--accent);background:var(--accent-soft)}
.rate button.easy:hover{border-color:var(--good);background:var(--good-soft)}

/* explanation reveal */
.explain{margin-top:14px;border-radius:12px;padding:12px 14px;font-size:.92rem;border:1px solid var(--line)}
.explain.ok{background:var(--good-soft);border-color:color-mix(in srgb,var(--good) 30%,transparent)}
.explain.no{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 30%,transparent)}
.explain .v{font-weight:800;display:block;margin-bottom:3px}

/* matching */
.match-grid{display:grid;gap:8px}
.match-row{display:flex;gap:8px;align-items:center}
.match-row .ml{flex:1;background:var(--surface-2);border:1px solid var(--line-strong);border-radius:10px;padding:10px 12px;font-size:.9rem}
.match-row select{flex:none;width:46%;padding:10px;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--surface);color:var(--text);font-size:.88rem}
.match-row select.correct{border-color:var(--good);background:var(--good-soft)}
.match-row select.wrong{border-color:var(--bad);background:var(--bad-soft)}

/* sticky action bar in quiz */
.qbar{position:sticky;bottom:0;left:0;right:0;margin:18px -16px -90px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,var(--bg) 60%,transparent);display:flex;gap:10px}

/* results */
.result-big{text-align:center;padding:10px 0 4px}
.result-big .score{font-size:3rem;font-weight:800;letter-spacing:-.03em}
.result-big .lbl{color:var(--text-dim)}
.scorebar{display:flex;height:14px;border-radius:999px;overflow:hidden;margin:14px 0;border:1px solid var(--line)}
.scorebar .s-good{background:var(--good)}
.scorebar .s-bad{background:var(--bad)}

/* breadcrumb / back */
.crumb{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:.85rem;color:var(--text-dim);flex-wrap:wrap}
.crumb a{cursor:pointer;color:var(--text-dim);text-decoration:none}
.crumb a:hover{color:var(--text)}
.crumb .sep{color:var(--text-faint)}

/* segmented control */
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:none;background:transparent;color:var(--text-dim);padding:8px 13px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.85rem}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}

/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:transl(-50%,20px);translate:-50% 20px;opacity:0;pointer-events:none;
  background:var(--surface);border:1px solid var(--line-strong);color:var(--text);padding:11px 16px;border-radius:12px;
  box-shadow:var(--shadow);font-size:.9rem;font-weight:600;transition:.25s;z-index:80;max-width:90vw}
.toast.show{opacity:1;translate:-50% 0}

/* speaker (TTS) button */
.spk{appearance:none;border:1px solid var(--line-strong);background:var(--surface-2);color:var(--text);
  width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:.85rem;display:inline-grid;place-items:center;flex:none;vertical-align:middle}
.spk:hover{border-color:var(--accent);background:var(--accent-soft)}
.spk.big{width:38px;height:38px;font-size:1rem}
.choice.selected{border-color:var(--accent);background:var(--accent-soft)}
.choice.selected .key{background:var(--accent);color:#fff;border-color:transparent}

/* exam timer */
.exam-timer{font-variant-numeric:tabular-nums;font-weight:800;font-size:.95rem;padding:5px 11px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line-strong);white-space:nowrap}
.exam-timer.warn{color:var(--warn);border-color:rgba(255,182,72,.4);background:rgba(255,182,72,.12)}
.exam-timer.danger{color:var(--bad);border-color:rgba(255,107,129,.4);background:var(--bad-soft)}

/* cram */
.cram-stat{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.cram-locks{flex:1;height:10px;border-radius:999px;background:var(--line);overflow:hidden}
.cram-locks > i{display:block;height:100%;background:linear-gradient(90deg,var(--good),#5fe0bf);transition:width .4s}
.cram-num{font-size:.82rem;font-weight:700;color:var(--text-dim);white-space:nowrap}
.cram-badge{display:inline-flex;gap:5px;align-items:center;font-size:.75rem;font-weight:700;color:var(--good);
  background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 30%,transparent);padding:3px 9px;border-radius:999px}

/* topic completion dots in the roadmap */
.tdots{display:flex;gap:5px;margin-top:7px}
.tdot{font-size:.66rem;font-weight:700;padding:2px 7px;border-radius:999px;border:1px solid var(--line-strong);color:var(--text-faint);background:var(--surface-2)}
.tdot.on{color:var(--good);border-color:transparent;background:var(--good-soft)}

/* For You feed */
.feed-status{display:flex;justify-content:space-between;gap:8px;font-size:.82rem;color:var(--text-dim);
  background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:8px 13px;margin-bottom:14px}
.feed-status b{color:var(--text)}
.btn.sm.on{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.action.foryou{background:linear-gradient(120deg,color-mix(in srgb,var(--accent) 26%,var(--surface)),var(--surface));border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.readiness-ring{--p:0}

/* exam-date editor */
.exam-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.exam-row .nm{flex:1;font-size:.92rem}
.exam-row input[type=date]{background:var(--surface-2);border:1px solid var(--line-strong);color:var(--text);border-radius:9px;padding:7px 9px;font-size:.85rem}
.exam-row .dd{font-size:.72rem;color:var(--warn);white-space:nowrap;min-width:54px;text-align:right}

/* activity heatmap */
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:3px}
.hcell{width:100%;aspect-ratio:1;border-radius:3px;background:var(--line)}
.heat .hcell{min-width:0}
.hcell.l0{background:var(--surface-2)}
.hcell.l1{background:color-mix(in srgb,var(--accent) 28%, var(--surface-2))}
.hcell.l2{background:color-mix(in srgb,var(--accent) 50%, var(--surface-2))}
.hcell.l3{background:color-mix(in srgb,var(--accent) 74%, var(--surface-2))}
.hcell.l4{background:var(--accent)}
.row .hcell{width:13px;aspect-ratio:1}

/* image-occlusion diagrams */
.diagram-box{position:relative;width:100%;max-width:420px;margin:8px auto 6px}
.diagram-box svg{width:100%;height:auto;display:block;border-radius:14px}
.dmark{position:absolute;transform:translate(-50%,-50%);min-width:24px;height:24px;padding:0 7px;border-radius:999px;
  background:var(--surface);border:2px solid var(--accent);color:var(--text);font-size:.72rem;font-weight:800;
  display:grid;place-items:center;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.dmark.active{background:var(--accent);color:#fff;animation:dmpulse 1.2s infinite}
.dmark.done{border-color:var(--good)}
.dmark.lbl{font-size:.66rem;font-weight:700}
@keyframes dmpulse{0%,100%{box-shadow:0 0 0 0 rgba(108,92,231,.55)}50%{box-shadow:0 0 0 8px rgba(108,92,231,0)}}
.why{display:block;margin-top:2px}

/* small helpers */
.kbd{font-family:var(--mono);font-size:.78rem;background:var(--surface-2);border:1px solid var(--line-strong);border-bottom-width:2px;border-radius:6px;padding:1px 6px}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--text-dim)}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:rgba(255,182,72,.14);color:var(--warn);border-color:transparent}
hr.div{border:none;border-top:1px solid var(--line);margin:18px 0}
.empty{text-align:center;color:var(--text-dim);padding:30px 10px}
.empty .big{font-size:2.4rem;margin-bottom:6px}

/* responsive up */
@media(min-width:620px){
  #app{padding:26px 22px 90px}
  .hero h1{font-size:2.1rem}
}
@media(max-width:430px){
  .actions{grid-template-columns:1fr 1fr}
  .compare{grid-template-columns:1fr}
}

/* exam-day forecast panel */
.forecast{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 9%,var(--surface)),var(--surface))}
.fc-overall{font-weight:800;font-size:1.5rem;color:var(--accent);line-height:1}
.fc-band{font-weight:600;font-size:.62em;color:var(--text-dim);opacity:.85}
.fc-sub{font-size:.78rem;margin:2px 0 10px}
.fc-row{display:flex;align-items:center;gap:9px;margin:7px 0}
.fc-ic{font-size:1rem;width:1.2em;text-align:center}
.fc-nm{flex:0 0 84px;font-size:.82rem;font-weight:600}
.fc-bar{flex:1;margin-top:0;--sub:var(--accent)}
.fc-pct{flex:0 0 38px;text-align:right;font-weight:700;font-size:.82rem}
.fc-min{flex:0 0 38px;text-align:right;font-size:.74rem;color:var(--text-dim)}
.fc-plan{font-size:.76rem;margin-top:10px;line-height:1.5}
/* misconception radar */
.mixup{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 12px}
.mx-c{font-weight:600;text-decoration:line-through;color:var(--text-dim)}
.mx-arrow{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);font-weight:700}
.mx-a{font-weight:700}
.mx-n{margin-left:auto;font-size:.74rem;color:var(--text-dim);background:var(--surface-2);border-radius:999px;padding:1px 8px}

.feed-gain{text-align:center;font-size:.86rem;color:var(--text);background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:12px;padding:9px 12px;margin:10px 0}
.crowd-line{margin-top:7px;font-size:.78rem;color:var(--text-dim)}
.exam-card{border-left:3px solid var(--sub,var(--accent))}

/* inline lesson sheet (pulled up from a wrong answer, over the feed) */
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;z-index:200;opacity:0;transition:opacity .2s}
.sheet-back.on{opacity:1}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:88vh;display:flex;flex-direction:column;border-radius:18px 18px 0 0;border:1px solid var(--line);border-bottom:none;box-shadow:0 -12px 44px rgba(0,0,0,.45);transform:translateY(16px);transition:transform .22s}
.sheet-back.on .sheet{transform:translateY(0)}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 16px;border-bottom:1px solid var(--line)}
.sheet-body{overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px 16px 10px;flex:1}
.sheet-foot{padding:12px 16px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
@media(min-width:560px){ .sheet-back{align-items:center} .sheet{border-radius:18px;border-bottom:1px solid var(--line)} }

/* reduce motion */
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .flash .inner{transition:none}
}

<body>
  <div id="app" aria-live="polite"><!-- rendered by app.js --></div>

  <!-- toast / feedback region -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- Engine -->
  <script>
/* ============================================================
   storage.js, global namespace, content registry, persistence
   ============================================================ */
(function (global) {
  "use strict";

  const KEY = "recall.finals.v1";
  const DAY = 86400000;

  const STUDY = {
    subjects: [],          // registered subjects, in display order
    byId: {},              // subjectId -> subject
    topicIndex: {},        // topicId -> {subject, topic}
    itemIndex: {},         // itemId -> {type, subject, topic, ref}
    EXAM_DATES: {},        // optional per-subject exam date (yyyy-mm-dd)
  };

  /* ---------- content registration ---------- */
  STUDY.register = function (subject) {
    STUDY.subjects.push(subject);
    STUDY.byId[subject.id] = subject;
    (subject.topics || []).forEach(function (topic, ti) {
      topic.subjectId = subject.id;
      if (!topic.id) topic.id = subject.id + "-t" + ti;
      STUDY.topicIndex[topic.id] = { subject: subject, topic: topic };
      // assign stable ids to questions and cards
      (topic.questions || []).forEach(function (q, qi) {
        q.id = topic.id + "#q" + qi;
        q.topicId = topic.id;
        q.subjectId = subject.id;
        STUDY.itemIndex[q.id] = { type: "q", subject: subject, topic: topic, ref: q };
      });
      (topic.cards || []).forEach(function (c, ci) {
        c.id = topic.id + "#c" + ci;
        c.topicId = topic.id;
        c.subjectId = subject.id;
        STUDY.itemIndex[c.id] = { type: "c", subject: subject, topic: topic, ref: c };
      });
    });
  };

  // append questions to a topic at runtime (after registration).
  // isGen=true  -> auto-generated (card→MC, parametric)
  // isGen=false -> authored "extra" variety questions
  STUDY.addQuestions = function (topic, qs, isGen) {
    const start = topic.questions.length;
    qs.forEach(function (q, k) {
      const qi = start + k;
      q.id = topic.id + "#q" + qi;
      q.topicId = topic.id;
      q.subjectId = topic.subjectId;
      q.gen = (isGen !== false);
      topic.questions.push(q);
      STUDY.itemIndex[q.id] = { type: "q", subject: STUDY.byId[topic.subjectId], topic: topic, ref: q };
    });
  };

  // add authored variety questions onto an existing topic by id (used by data/extra.js)
  STUDY.addAuthored = function (topicId, qs) {
    const entry = STUDY.topicIndex[topicId];
    if (entry) STUDY.addQuestions(entry.topic, qs, false);
  };

  STUDY.allQuestions = function (filterFn) {
    const out = [];
    STUDY.subjects.forEach(function (s) {
      s.topics.forEach(function (t) {
        (t.questions || []).forEach(function (q) {
          if (!filterFn || filterFn(q, t, s)) out.push(q);
        });
      });
    });
    return out;
  };

  /* ---------- persistence ---------- */
  const DEFAULT = function () {
    return {
      v: 1,
      srs: {},        // itemId -> {box, due, last, reps, lapses}
      stats: {},      // topicId -> {attempts, correct, seen, cards}
      wrong: {},      // itemId -> true (needs review)
      seen: {},       // topicId -> last visited ts
      done: {},       // topicId -> {learn, cards, practice, practiceBest}
      starred: {},    // itemId -> ts (bookmarks)
      streak: { count: 0, last: 0, best: 0 },
      activity: {},   // 'yyyy-mm-dd' -> count
      masteryHist: {},// 'yyyy-mm-dd' -> overall mastery % (snapshot)
      subjectSkill: {},// subjectId -> ability rating mirror (adaptive engine)
      glicko: {},     // subjectId -> {r, rd, t} Glicko-style ability + uncertainty
      examDates: {},  // subjectId -> 'yyyy-mm-dd'
      exams: {},      // subjectId -> {done, doneAt, predicted, actual, gradedAt} (forecast accountability)
      log: [],        // study-data event log (local, for your own export)
      tele: {},       // anonymous telemetry state (anon id, last ping day)
      teleQueue: [],  // outbound anonymous events awaiting upload
      miss: {},       // subjectId -> [{it, c:chosenText, a:answerText, cc:concept, t}] (misconception radar)
      flagged: {},    // itemId -> {t, reason} reported-as-broken questions (suppressed)
      rtBase: {},     // questionType -> rolling baseline response time (self-calibrated fluency)
      lastTest: null, // last generated test manifest (for entering results later)
      settings: { theme: "dark" },
      sync: null,     // {code, rev, last, status} opt-in cross-device sync (device-local meta)
    };
  };

  let store = DEFAULT();

  STUDY.load = function () {
    try {
      const raw = localStorage.getItem(KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        store = Object.assign(DEFAULT(), parsed);
        // ensure nested objects exist
        ["srs", "stats", "wrong", "seen", "done", "starred", "activity", "masteryHist", "subjectSkill", "examDates", "miss", "flagged", "glicko", "exams"].forEach(function (k) {
          if (!store[k]) store[k] = {};
        });
        if (!store.streak) store.streak = { count: 0, last: 0, best: 0 };
        if (!Array.isArray(store.log)) store.log = [];
        if (!store.tele) store.tele = {};
        if (!Array.isArray(store.teleQueue)) store.teleQueue = [];
        if (!store.settings) store.settings = { theme: "dark" };
      }
    } catch (e) { store = DEFAULT(); }
    return store;
  };

  // Write synchronously on every change so progress survives an immediate
  // tab close / refresh. localStorage is fast and the payload is tiny.
  STUDY.save = function () {
    try { localStorage.setItem(KEY, JSON.stringify(store)); } catch (e) {}
    // nudge the (optional) cross-device sync layer that local data changed
    try { if (STUDY.SYNC && STUDY.SYNC.onLocalChange) STUDY.SYNC.onLocalChange(); } catch (e) {}
  };
  STUDY.flush = STUDY.save;

  STUDY.store = function () { return store; };

  STUDY.reset = function () {
    store = DEFAULT();
    try { localStorage.removeItem(KEY); } catch (e) {}
    STUDY.save();
  };

  STUDY.exportData = function () { return JSON.stringify(store); };
  // compact copy-paste export: everything needed to RESTORE progress, minus the
  // behavioral log + outbound queue (which are big and not needed to restore).
  STUDY.exportProgress = function () {
    const copy = {}; Object.keys(store).forEach(function (k) { if (k !== "log" && k !== "teleQueue") copy[k] = store[k]; });
    return JSON.stringify(copy);
  };

  /* ---- LZ string compression (pieroxy lz-string, base64 variant; public domain) ----
     Lets a copy-paste code carry the ENTIRE store (log included) at ~1/5 the size,
     synchronously (no async clipboard quirks) and fully offline. */
  const LZ = (function () {
    const keyStr = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=";
    const rev = {}; for (let z = 0; z < keyStr.length; z++) rev[keyStr.charAt(z)] = z;
    const f = String.fromCharCode;
    function _compress(uncompressed, bitsPerChar, getCharFromInt) {
      if (uncompressed == null) return "";
      let i, value, dict = {}, toCreate = {}, c = "", wc = "", w = "", enlargeIn = 2,
        dictSize = 3, numBits = 2, data = [], dataVal = 0, dataPos = 0;
      function push(v) { dataVal = (dataVal << 1) | v; if (dataPos == bitsPerChar - 1) { dataPos = 0; data.push(getCharFromInt(dataVal)); dataVal = 0; } else dataPos++; }
      function emit(w) {
        if (Object.prototype.hasOwnProperty.call(toCreate, w)) {
          if (w.charCodeAt(0) < 256) { for (i = 0; i < numBits; i++) push(0); value = w.charCodeAt(0); for (i = 0; i < 8; i++) { push(value & 1); value >>= 1; } }
          else { value = 1; for (i = 0; i < numBits; i++) { push(value); value = 0; } value = w.charCodeAt(0); for (i = 0; i < 16; i++) { push(value & 1); value >>= 1; } }
          enlargeIn--; if (enlargeIn == 0) { enlargeIn = Math.pow(2, numBits); numBits++; } delete toCreate[w];
        } else { value = dict[w]; for (i = 0; i < numBits; i++) { push(value & 1); value >>= 1; } }
        enlargeIn--; if (enlargeIn == 0) { enlargeIn = Math.pow(2, numBits); numBits++; }
      }
      for (let ii = 0; ii < uncompressed.length; ii++) {
        c = uncompressed.charAt(ii);
        if (!Object.prototype.hasOwnProperty.call(dict, c)) { dict[c] = dictSize++; toCreate[c] = true; }
        wc = w + c;
        if (Object.prototype.hasOwnProperty.call(dict, wc)) { w = wc; }
        else { emit(w); dict[wc] = dictSize++; w = String(c); }
      }
      if (w !== "") emit(w);
      value = 2; for (i = 0; i < numBits; i++) { push(value & 1); value >>= 1; }
      while (true) { dataVal = (dataVal << 1); if (dataPos == bitsPerChar - 1) { data.push(getCharFromInt(dataVal)); break; } else dataPos++; }
      return data.join("");
    }
    function _decompress(length, resetValue, getNextValue) {
      let dictionary = [], enlargeIn = 4, dictSize = 4, numBits = 3, entry = "", result = [],
        i, w, bits, resb, maxpower, power, c, data = { val: getNextValue(0), position: resetValue, index: 1 };
      for (i = 0; i < 3; i++) dictionary[i] = i;
      function readBits(n) { let b = 0, mp = Math.pow(2, n), p = 1; while (p != mp) { resb = data.val & data.position; data.position >>= 1; if (data.position == 0) { data.position = resetValue; data.val = getNextValue(data.index++); } b |= (resb > 0 ? 1 : 0) * p; p <<= 1; } return b; }
      let next = readBits(2);
      switch (next) { case 0: c = f(readBits(8)); break; case 1: c = f(readBits(16)); break; case 2: return ""; }
      dictionary[3] = c; w = c; result.push(c);
      while (true) {
        if (data.index > length) return "";
        c = readBits(numBits);
        switch (c) {
          case 0: dictionary[dictSize++] = f(readBits(8)); c = dictSize - 1; enlargeIn--; break;
          case 1: dictionary[dictSize++] = f(readBits(16)); c = dictSize - 1; enlargeIn--; break;
          case 2: return result.join("");
        }
        if (enlargeIn == 0) { enlargeIn = Math.pow(2, numBits); numBits++; }
        if (dictionary[c]) entry = dictionary[c]; else { if (c === dictSize) entry = w + w.charAt(0); else return null; }
        result.push(entry); dictionary[dictSize++] = w + entry.charAt(0); enlargeIn--; w = entry;
        if (enlargeIn == 0) { enlargeIn = Math.pow(2, numBits); numBits++; }
      }
    }
    return {
      compressToBase64: function (input) {
        if (input == null) return "";
        const res = _compress(input, 6, function (a) { return keyStr.charAt(a); });
        switch (res.length % 4) { default: case 0: return res; case 1: return res + "==="; case 2: return res + "=="; case 3: return res + "="; }
      },
      decompressFromBase64: function (input) {
        if (input == null) return ""; if (input === "") return null;
        return _decompress(input.length, 32, function (index) { return rev[input.charAt(index)]; });
      },
    };
  })();
  STUDY.LZ = LZ;

  // pack EVERYTHING (full store, log included) into a compact copy-paste code.
  STUDY.packData = function () { return "RZ1:" + LZ.compressToBase64(JSON.stringify(store)); };
  // accept anything: an RZ1 compressed code, a bare compressed blob, or raw JSON.
  STUDY.unpackData = function (str) {
    str = String(str == null ? "" : str).trim();
    if (!str) return null;
    if (str.indexOf("RZ1:") === 0) { try { return JSON.parse(LZ.decompressFromBase64(str.slice(4))); } catch (e) { return null; } }
    if (str.charAt(0) === "{") { try { return JSON.parse(str); } catch (e) { return null; } }
    try { const j = LZ.decompressFromBase64(str); if (j && j.charAt(0) === "{") return JSON.parse(j); } catch (e) { }   // marker stripped by a paste field
    return null;
  };

  // --- study-data export (for your own analysis; local + private) ---
  STUDY.studyData = function () {
    const log = store.log || [];
    const bySubject = {}, byTopic = {}, byMode = {}, byDay = {};
    let totalRt = 0, rtN = 0;
    log.forEach(function (e) {
      const add = (o, k) => { const r = o[k] || (o[k] = { attempts: 0, correct: 0 }); r.attempts++; if (e.ok) r.correct++; };
      if (e.s) add(bySubject, e.s);
      if (e.tp) add(byTopic, e.tp);
      add(byMode, e.m || "other");
      const day = dayKey(e.t); byDay[day] = (byDay[day] || 0) + 1;
      if (e.rt) { totalRt += e.rt; rtN++; }
    });
    const acc = (o) => { Object.keys(o).forEach(k => o[k].accuracy = +(o[k].correct / Math.max(1, o[k].attempts)).toFixed(3)); return o; };
    return {
      generated: new Date().toISOString(),
      note: "Local study-data export from Recall. Behavior events only, no personal information.",

/* ============================================================
   srs.js, spaced repetition + interleaving

   Grades: 0 = Again/wrong, 1 = Hard, 2 = Good/correct, 3 = Easy

  "use strict";
  const MIN = 60000, HOUR = 3600000, DAY = 86400000;

  const BOX_INTERVAL = [10 * MIN, 4 * HOUR, 9 * HOUR, 1 * DAY, 3 * DAY, 7 * DAY];

  const SRS = {
    // mutate state {box,due} given a grade
    schedule: function (st, grade, now) {
      now = now || Date.now();
      if (grade <= 0) {
        st.box = 1;                 // back to start (but learned, so box 1 not 0)
        st.due = now + 10 * MIN;    // re-surface very soon
      } else if (grade === 1) {
        st.box = Math.max(1, st.box);           // hard: hold position
        st.due = now + BOX_INTERVAL[st.box];
      } else if (grade === 2) {
        st.box = Math.min(5, (st.box || 0) + 1); // good: advance one box
        st.due = now + jitter(BOX_INTERVAL[st.box]);
      } else {
        st.box = Math.min(5, (st.box || 0) + 2); // easy: jump ahead
        st.due = now + jitter(BOX_INTERVAL[st.box]);
      }
      return st;

    BOX_INTERVAL: BOX_INTERVAL,

  function jitter(ms) { return Math.round(ms * (0.9 + Math.random() * 0.2)); }

  /* ---------- queue builders ---------- */

  // Fisher-Yates
  function shuffle(a) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }

  }

  // Items must have .topicId

        if (k === lastTopic && nonEmptyCount(buckets, keys) > 1) return;

    // "Fast" is relative to YOUR own rolling pace per question type, not a fixed
    // threshold, so a naturally slow reader isn't punished and a speed-reader
    // isn't over-credited. A baseline seeds near the old threshold, then adapts.
    store.rtBase = store.rtBase || {};
    const base = store.rtBase[type] || (FAST[type] || 5000) * 1.1;
    const pre = store.srs[q.id];
    const priorKn = pre && typeof pre.kn === "number" ? pre.kn : 0;
    let fluency = 0.5;
    if (rtMs) {
      fluency = clamp(1.25 - 0.75 * (rtMs / base), 0, 1);   // ~0.33×base→1, 1×→0.5, 1.67×→0
      // content-aware "too fast" guard: only suspicious if you answered faster than
      // you could plausibly READ it AND you haven't already proven you know it.
      // (Position reshuffle + distractor variation already block pattern memorising,
      //  so genuine fast recall on a known item gets full credit.)
      if (rtMs < minReadMs(q) && priorKn < 0.7) fluency = Math.min(fluency, 0.4);

    }

    const ability = ADAPT.abilityOf(q.subjectId);
    const diff = pre && pre.diff ? pre.diff : STUDY.seedDiff(q);
    const expct = 1 / (1 + Math.pow(10, (diff - ability) / 400));

    // --- effective grade for spacing (fluency-based, with a guess flag) ---
    let grade;
    if (!correct) grade = 0;
    else if (guess) grade = 1;
    else if (fluency >= 0.62) grade = 3;
    else grade = 2;

    const meta = { mode: mode || "feed", rt: rtMs || 0, fluency: fluency, pexp: expct, level: level || 0 };
    if (typeof chosen === "number") meta.chosen = chosen;
    STUDY.recordItem(q.id, grade, q.topicId, meta);   // scheduling + honest mastery + log
    const st = store.srs[q.id];                        // now exists
    st.rt = rtMs || st.rt || 0;

    // --- ratings: Glicko ability (uncertainty-aware) + item difficulty (Elo) ---
    const s = grade >= 2 ? 1 : grade === 1 ? 0.5 : 0;
    glickoUpdate(q.subjectId, diff, s, Date.now());

  function subjectStat(s) {

    s.topics.forEach(function (t) {
      const st = store.stats[t.id]; if (st) { att += st.attempts; cor += st.correct; }

  function dueQueue(only, recent, now) {
    const store = STUDY.store(), out = [];
    pool().forEach(function (q) {
      if (only && q.subjectId !== only) return;

      if (recent && recent.indexOf(q.id) >= 0) return;
      if (STUDY.isFlagged && STUDY.isFlagged(q.id)) return;
      const st = store.srs[q.id];
      if (st && st.reps > 0 && st.due && st.due <= now) out.push({ q: q, over: now - st.due, sub: q.subjectId });

    if (!explore) {

      });
      if (fresh.length && Math.random() < clamp(fresh.length / (fresh.length + 14), 0, 0.4)) {
        let pickFrom = fresh.filter(q => q.topicId !== ctx.lastTopic);   // interleave topics

      const live = STUDY.subjects.filter(s => !examDone(s.id));

      const pc = pCorrect(q, now);

  };

  // ---- readiness %, concept-based, so it climbs without acing all 739 items ----
  // Each topic is "ready" once you've mastered ~6 of its questions; a subject's
  // readiness is the average over its topics (untouched topics count as 0).
  ADAPT.readiness = function (subjectId) {
    const subj = STUDY.byId[subjectId]; if (!subj) return 0;
    let sum = 0, n = 0;
    subj.topics.forEach(function (t) {
      const items = (t.questions || []).filter(q => q.type !== "match" && !STUDY.isFlagged(q.id));
      if (!items.length) return;
      let mastered = 0, attempted = 0;
      items.forEach(function (q) { const m = STUDY.itemMastery(q.id); if (m > 0) attempted++; if (m >= 0.55) mastered++; });
      const target = Math.min(items.length, 6);
      const depth = clamp((mastered + 0.25 * Math.min(attempted - mastered, target)) / target, 0, 1);
      sum += depth; n++;

  };
  ADAPT.overallReadiness = function () {
    let s = 0, n = 0;
    STUDY.subjects.forEach(function (subj) { s += ADAPT.readiness(subj.id); n++; });
    return n ? Math.round(s / n) : 0;
  };

     EXAM-DAY FORECASTER + STUDY PLANNER

  function guessFloor(q) {

  function pExamAt(q, examMs) {
    const store = STUDY.store();
    const st = store.srs[q.id];

    const g = guessFloor(q);
    if (!st) return g + (1 - g) * pSkill * 0.45;         // unseen: a little credit for reasoning
    // how well you know it: honest-mastery OR demonstrated Leitner box (whichever
    // higher): both signal real learning, and box isn't suppressed by missing rt.
    const know = Math.max((typeof st.kn === "number") ? st.kn : 0, Math.min(1, (st.box || 0) / 4));
    // REALISTIC forgetting: well-learned material is DURABLE (multi-day), not the
    // few-hours stability that massed/untimed practice produces. Floor the effective
    // memory-stability by how well you know it, so the forecast only fades what you
    // HAVEN'T cemented (low know decays fast; a long gap still decays even if known).
    const elapsedH = Math.max(0, (examMs - (st.last || examMs)) / HOUR);
    const effStab = Math.max(st.stability || 4, 18 + 90 * know);   // hours; known ≈ days
    const r = Math.pow(2, -elapsedH / effStab);

  }
  function examMsFor(subjectId) {
    const days = STUDY.daysToExam(subjectId);
    return Date.now() + Math.max(0, days) * DAY;
  }
  // predicted exam score for a subject.
  // topicScore = prior + (how well you know what you studied − prior) × coverage,
  // where coverage saturates after ~8 studied items/topic (the exam samples, it
  // doesn't test all 300+ items), so studying actually moves the number, and
  // pExamAt already decays studied items toward exam day (cramming-then-forgetting
  // is penalised). Topic-balanced so a big question bank can't skew it.
  const UNSEEN_PRIOR = 0.33;        // cold: ~guess + a little elimination
  ADAPT.forecast = function (subjectId) {
    const subj = STUDY.byId[subjectId]; if (!subj) return 0;
    const store = STUDY.store(), examMs = examMsFor(subjectId);
    let sum = 0, n = 0;
    subj.topics.forEach(function (t) {
      const items = (t.questions || []).filter(q => q.type !== "match" && !STUDY.isFlagged(q.id));
      if (!items.length) return;
      let acc = 0, studied = 0;
      items.forEach(function (q) { if (store.srs[q.id]) { acc += pExamAt(q, examMs); studied++; } });
      const studiedAcc = studied ? acc / studied : UNSEEN_PRIOR;

    // far off the forecast has been (shrunk, so 1-2 grades barely move it).
    const rec = STUDY.examRecord && STUDY.examRecord(subjectId);
    if (!(rec && typeof rec.actual === "number") && STUDY.examCalibration) {

  };

    let s = 0, w = 0;
    STUDY.subjects.forEach(function (subj) { const wt = subj.weight || 1; s += ADAPT.forecast(subj.id) * wt; w += wt; });

  ADAPT.forecastBand = function (subjectId) {

  };

    let s = 0, n = 0; STUDY.subjects.forEach(function (subj) { s += ADAPT.forecastBand(subj.id); n++; });
    return n ? Math.round(s / n) : 0;
  };

  ADAPT.shakyCount = function (subjectId, thresh) {
    const subj = STUDY.byId[subjectId]; if (!subj) return 0;
    const store = STUDY.store(), examMs = examMsFor(subjectId), th = thresh || 0.6;
    let c = 0;
    subj.topics.forEach(function (t) {

    const subj = STUDY.byId[subjectId]; if (!subj) return [];
    const store = STUDY.store(), examMs = examMsFor(subjectId), out = [];
    subj.topics.forEach(function (t) {
      (t.questions || []).forEach(function (q) {
        if (q.type === "match" || !store.srs[q.id]) return;
        out.push({ q: q, p: pExamAt(q, examMs) });
      });
    });
    out.sort((a, b) => a.p - b.p);
    return out.slice(0, limit || 30).map(x => x.q);
  };
  // allocate `minutes` across subjects by importance × urgency × gap-to-target
  ADAPT.studyPlan = function (minutes) {
    const total = minutes || 60, target = 85;
    let soonest = 99;
    const rows = STUDY.subjects.map(function (s) {
      const f = ADAPT.forecast(s.id);
      const days = STUDY.daysToExam(s.id); if (days < soonest) soonest = days;
      const gap = clamp((target - f) / target, 0, 1);
      const urg = 1 + 3 / (1 + Math.max(0, days));
      const imp = 0.6 + (s.weight || 1) * 0.12;
      const rec = STUDY.examRecord && STUDY.examRecord(s.id);
      const done = !!(rec && rec.done);                  // exam taken → stop telling you to study it
      const priority = done ? 0 : imp * urg * (0.12 + gap);
      return { id: s.id, name: s.name, icon: s.icon, weight: s.weight, forecast: f, shaky: ADAPT.shakyCount(s.id), done: done, priority: priority, minutes: 0 };
    });
    const sum = rows.reduce((a, b) => a + b.priority, 0) || 1;
    let used = 0;
    rows.forEach(function (r) { r.minutes = Math.max(0, Math.round((r.priority / sum) * total / 5) * 5); used += r.minutes; });
    rows.sort((a, b) => b.priority - a.priority);
    return { minutes: total, mode: soonest <= 1 ? "final" : "build", soonest: soonest, overall: ADAPT.overallForecast(), rows: rows };
  };

  STUDY.ADAPT = ADAPT;
})(window.STUDY);

  <script>
/* ============================================================
   telemetry.js, anonymous, opt-out usage & learning data.
   • No name/email/account, no third-party trackers, no fingerprinting.
   • Sends only the same study events you can export yourself, plus a daily
     heartbeat and a session-open ping (for active-user counts).
   • Fully offline-safe: events queue locally and upload when online.
   • INERT until ENDPOINT + KEY are set below (a Supabase REST URL + anon key).
     Until then nothing leaves the device; events just buffer.
   Opt out anytime in Settings → Privacy & data.
   ============================================================ */
(function (STUDY) {
  "use strict";
  // ---- backend config (Supabase REST, insert-only) ----
  const ENDPOINT = "https://gyfqhkhgosjpyvatffbi.supabase.co/rest/v1/events";
  const KEY = "sb_publishable_q-_2MgYpTJB-OeGGIy8EzA_8mvRB1nb";   // publishable (client-safe) key
  const APP_VERSION = "1.0";
  const BATCH = 200;

  function uid() {
    return (Date.now().toString(36) + Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 6));
  }

  function configured() { return !!(ENDPOINT && KEY); }

    const st = STUDY.store();

  }

    if (!enabled() || !configured()) return;
    const st = STUDY.store();
    const q = st.teleQueue || [];

    flushing = true;
    const slice = q.slice(0, BATCH);
    const rows = slice.map(e => ({
      anon: st.tele.anonId, sess: SESSION, app: "recall", v: APP_VERSION,
      t: e.t, item: e.it || null, topic: e.tp || null, subject: e.s || null,
      grade: e.g, correct: e.ok, rt: e.rt || null, mode: e.m || null, level: e.lv || null,
      chosen: (typeof e.ch === "number" ? e.ch : null),   // which distractor was picked (wrong MC)
    }));

    const headers = { "Content-Type": "application/json", "apikey": KEY, "Authorization": "Bearer " + KEY, "Prefer": "return=minimal" };
    fetch(ENDPOINT, { method: "POST", headers: headers, body: body, keepalive: !!final })
      .then(function (r) { if (r && r.ok) { st.teleQueue = q.slice(slice.length); STUDY.save(); } })
      .catch(function () {})

  function start() {

    if (!st.tele) st.tele = {};
    if (!st.tele.anonId) { st.tele.anonId = uid(); st.tele.firstSeen = Date.now(); STUDY.save(); }
    SESSION = uid();
    // daily heartbeat (one per local day) for active-user counts
    const day = STUDY.dayKey(Date.now());
    if (st.tele.lastPing !== day) { st.tele.lastPing = day; queueUsage("heartbeat"); STUDY.save(); }
    queueUsage("open");
    flush(false);
    setInterval(function () { flush(false); }, 45000);
    window.addEventListener("online", function () { flush(false); });
    window.addEventListener("pagehide", function () { flush(true); });
    document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") flush(true); });
  }

  STUDY.TELE = {
    start: start, flush: flush, enabled: enabled, configured: configured,
    pending: function () { return (STUDY.store().teleQueue || []).length; },
    anonId: function () { return (STUDY.store().tele || {}).anonId || ""; },
    setEnabled: function (on) { STUDY.store().settings.telemetry = !!on; if (!on) STUDY.store().teleQueue = []; STUDY.save(); },
  };

  /* ============================================================
     CROWD CALIBRATION (read-only aggregates).
     Reads a per-item AGGREGATE view (item_stats: attempts, correct, avg_rt,
     learners), never raw rows or anon IDs, so privacy holds. Every use is
     SHRUNK by sample size, so with little data (just you + a little) it changes

     Degrades to a no-op if the view doesn't exist yet (fetch just returns empty).

  const STATS_URL = ENDPOINT.replace(/\/events$/, "/item_stats");
  const CROWD_KEY = "recall_crowd_v1";
  const REF = 1500, K_SHRINK = 18, SUSPECT_N = 8, SUSPECT_RATE = 0.4;
  const cclamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;
  let CROWD = { items: {}, fetched: 0 };

  function loadCrowd() { try { const r = localStorage.getItem(CROWD_KEY); if (r) { const p = JSON.parse(r); if (p && p.items) CROWD = p; } } catch (e) { } }
  function saveCrowd() { try { localStorage.setItem(CROWD_KEY, JSON.stringify(CROWD)); } catch (e) { } }

    fetch(STATS_URL + "?select=item,attempts,correct,avg_rt,learners", { headers: { apikey: KEY, "Authorization": "Bearer " + KEY } })

    has: function () { return CROWD.items && Object.keys(CROWD.items).length > 0; },
    // raw per-item stat (or null). rate = crowd success rate; learners = distinct people
    stat: function (id) { const s = CROWD.items && CROWD.items[id]; if (!s || !s.n) return null; return { n: s.n, rate: s.c / s.n, rt: s.rt, learners: s.u }; },

    // w = n/(n+18) → ~0 when sparse (safe), → 1 as the crowd grows.
    shrunkDiff: function (id, localDiff) {

      const cd = this.diff(id); if (cd == null) return localDiff;

    suspectList: function () {

      return out.sort(function (a, b) { return a.rate - b.rate; });
    },
  };

/* js/sync.js — opt-in cross-device sync over the existing Supabase project.
   Devices that share a high-entropy CODE read/write one row through SECURITY
   DEFINER functions (sync_get / sync_put / sync_rev), so the anon key can never
   enumerate other rows. Sync is a MERGE (STUDY.mergeInto), so phone + laptop
   progress combines instead of one clobbering the other.

   INSTANT sync: every change pushes within ~0.6s, and the other device is woken
   the moment we push via a Supabase Realtime broadcast (WebSocket). A cheap
   rev-check poll (~2.5s while active) is the always-on fallback if realtime
   can't connect. Inert until the user turns it on in Settings. */
(function (STUDY) {
  "use strict";
  if (!STUDY) return;
  var HOST = "https://gyfqhkhgosjpyvatffbi.supabase.co";
  var RPC = HOST + "/rest/v1/rpc/";
  var KEY = "sb_publishable_q-_2MgYpTJB-OeGGIy8EzA_8mvRB1nb";   // publishable (client-safe)
  var HEADERS = { "Content-Type": "application/json", "apikey": KEY, "Authorization": "Bearer " + KEY, "Accept": "application/json" };
  var PUSH_DEBOUNCE = 600, POLL_FAST = 2500, POLL_IDLE = 15000, ACTIVE_WINDOW = 120000;

  var SYNC = {};
  STUDY.SYNC = SYNC;
  var inSync = false, metaWrite = false, pushTimer = null, pollTimer = null, lastActivity = 0, listeners = [];

  function st() { return STUDY.store(); }
  function online() { return typeof navigator === "undefined" || navigator.onLine !== false; }
  function visible() { return typeof document === "undefined" || document.visibilityState === "visible"; }
  function markActivity() { lastActivity = Date.now(); }
  SYNC.enabled = function () { var s = st().sync; return !!(s && s.code); };
  SYNC.code = function () { var s = st().sync; return (s && s.code) || ""; };
  SYNC.status = function () { var s = st().sync; return (s && s.status) || (SYNC.enabled() ? "idle" : "off"); };
  SYNC.lastSync = function () { var s = st().sync; return (s && s.last) || 0; };

  function writeMeta(patch) {
    var s = st();
    s.sync = Object.assign({ code: "", rev: 0, last: 0, status: "idle" }, s.sync || {}, patch);
    metaWrite = true; STUDY.save(); metaWrite = false;
  }
  function notify() { listeners.forEach(function (fn) { try { fn(SYNC.status()); } catch (e) {} }); }
  SYNC.onChange = function (fn) { if (typeof fn === "function") listeners.push(fn); };

  // ---- code: 16 base32 chars (~80 bits) so it doubles as an unguessable secret
  function genCode() {
    var alpha = "0123456789abcdefghjkmnpqrstvwxyz", out = "", n = 16, buf = null;
    try { buf = new Uint8Array(n); (self.crypto || window.crypto).getRandomValues(buf); } catch (e) { buf = null; }
    for (var i = 0; i < n; i++) { var v = buf ? buf[i] : Math.floor(Math.random() * 256); out += alpha.charAt(v & 31); }
    return out;
  }
  SYNC.formatCode = function (c) { c = (c || "").replace(/[^0-9a-z]/gi, "").toLowerCase(); return c.replace(/(.{4})(?=.)/g, "$1-"); };
  SYNC.cleanCode = function (c) {
    c = String(c || "").trim();
    var m = c.match(/#\/?link\/([0-9a-z]+)/i); if (m) return m[1].toLowerCase();   // accept a pairing link
    return c.replace(/[^0-9a-z]/gi, "").toLowerCase();
  };

  function rpc(fn, body) {
    return fetch(RPC + fn, { method: "POST", headers: HEADERS, body: JSON.stringify(body) })
      .then(function (r) { if (!r.ok) throw new Error("rpc " + fn + " " + r.status); return r.json(); });
  }

    });

  // already hold our exact state). rev-guarded with conflict retry.
  function doSync(code, attempt) {
    return SYNC.pull().then(function (remote) {
      var knownRev = 0;
      if (remote && remote.data) { STUDY.applySyncBlob(remote.data); knownRev = remote.rev; }
      var blob = STUDY.syncBlob();

      return rpc("sync_put", { p_code: code, p_data: blob, p_rev: knownRev }).then(function (rows) {
        var row = Array.isArray(rows) ? rows[0] : rows;
        if (row && row.conflict && attempt < 4) return doSync(code, attempt + 1);   // someone pushed; re-merge
        var newRev = (row && row.rev) || (knownRev + 1);
        writeMeta({ rev: newRev, last: Date.now(), status: "ok" });
        rtBroadcast(newRev);                                  // wake the other device instantly
        return true;
      });
    });
  }
  SYNC.syncNow = function (reason) {
    var code = SYNC.code();
    if (!code) return Promise.resolve(false);
    if (!online()) { writeMeta({ status: "offline" }); notify(); return Promise.resolve(false); }
    if (inSync) return Promise.resolve(false);
    inSync = true; writeMeta({ status: "syncing" }); notify();
    return doSync(code, 0).then(function (ok) { inSync = false; notify(); return ok; })
      .catch(function () { inSync = false; writeMeta({ status: "error" }); notify(); return false; });
  };

  // debounced auto-push the instant local data changes
  SYNC.onLocalChange = function () {
    if (!SYNC.enabled() || inSync || metaWrite || !online()) return;
    markActivity();
    if (pushTimer) clearTimeout(pushTimer);
    pushTimer = setTimeout(function () { pushTimer = null; SYNC.syncNow("change"); }, PUSH_DEBOUNCE);
    if (!pollTimer) scheduleNextPoll();

  // ---- cheap fallback poll: ask only for the rev; full sync only when it moved
  function pollTick() {

    if (!SYNC.enabled()) return;
    if (online() && visible()) {
      rpc("sync_rev", { p_code: SYNC.code() }).then(function (rows) {

      }).catch(function () {}).then(scheduleNextPoll);
    } else { scheduleNextPoll(); }
  }
  function scheduleNextPoll() {
    if (pollTimer) clearTimeout(pollTimer);
    if (!SYNC.enabled()) return;
    var iv = (Date.now() - lastActivity < ACTIVE_WINDOW) ? POLL_FAST : POLL_IDLE;
    pollTimer = setTimeout(pollTick, iv);
  }

  // ---- best-effort realtime: a tiny Supabase Realtime (Phoenix) broadcast client.
  // Wakes the other device the instant we push; if it can't connect, the poll covers it.
  var ws = null, wsRef = 0, hbTimer = null, reconnectTimer = null, joined = false;
  function wsUrl() { return HOST.replace(/^http/, "ws") + "/realtime/v1/websocket?apikey=" + encodeURIComponent(KEY) + "&vsn=1.0.0"; }
  function chan() { return "realtime:recall-" + SYNC.code(); }
  function wsSend(o) { try { if (ws && ws.readyState === 1) ws.send(JSON.stringify(o)); } catch (e) {} }
  function rtConnect() {

      wsSend({ topic: chan(), event: "phx_join", payload: { config: { broadcast: { self: false, ack: false }, presence: { key: "" } } }, ref: String(++wsRef) });

      hbTimer = setInterval(function () { wsSend({ topic: "phoenix", event: "heartbeat", payload: {}, ref: String(++wsRef) }); }, 25000);
    };

    };

    ws.onerror = function () { try { ws.close(); } catch (e) {} };
  }
  function scheduleReconnect() { if (reconnectTimer) clearTimeout(reconnectTimer); if (!SYNC.enabled()) return; reconnectTimer = setTimeout(rtConnect, 5000); }
  function rtBroadcast(rev) { if (joined) wsSend({ topic: chan(), event: "broadcast", payload: { type: "broadcast", event: "sync", payload: { r: rev } }, ref: String(++wsRef) }); }
  function rtDisconnect() {
    if (hbTimer) { clearInterval(hbTimer); hbTimer = null; }
    if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
    try { if (ws) { ws.onclose = null; ws.close(); } } catch (e) {}

  }
  function start() { markActivity(); scheduleNextPoll(); rtConnect(); }

  SYNC.enable = function () {                 // first device: create a sync identity
    if (SYNC.enabled()) return SYNC.code();
    writeMeta({ code: genCode(), rev: 0, status: "idle", enabledAt: Date.now() });
    start(); SYNC.syncNow("enable");
    return SYNC.code();
  };
  SYNC.linkWith = function (input) {          // second device: join an existing identity
    var c = SYNC.cleanCode(input);
    if (!c || c.length < 8) return false;

    return true;
  };
  SYNC.unlink = function () { rtDisconnect(); if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; } var s = st(); s.sync = null; metaWrite = true; STUDY.save(); metaWrite = false; notify(); };

  SYNC.init = function () {
    if (typeof window === "undefined") return;
    window.addEventListener("online", function () { rtConnect(); markActivity(); SYNC.syncNow("online"); });

    if (SYNC.enabled()) SYNC.syncNow("boot");
  };
})(window.STUDY);
