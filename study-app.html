pped at the man without warning"],"answer":3,"tag":"story"},{"type":"mc","q":"Select the example of DIRECT characterization","choices":["A character snapping at someone without warning","A character getting into a fight","A character assisting someone across the street","A narrator saying, \"Jane is a cruel person\""],"answer":3,"tag":"story"},{"type":"mc","q":"The high point of a plot is...","choices":["The climax","Inciting incident","Rising action","Resolution"],"answer":0,"tag":"story"},{"type":"mc","q":"What is it called when an author gives us hints about what might come next?","choices":["Imagery","Flashback","Foreshadowing","Suspense"],"answer":2,"tag":"devices"},{"type":"mc","q":"What is third-person omniscient?","choices":["The narrator isn't in the story and knows one character's thoughts","When the author says the opposite of what they mean","When the narrator is a character in the story","The narrator is not a character in the story and knows everyone's thoughts"],"answer":3,"tag":"story"},{"type":"mc","q":"What is it called when an author creates tension that gives us anxiety?","choices":["Suspense","Dialogue","Verbal irony","Foreshadowing"],"answer":0,"tag":"devices"},{"type":"mc","q":"What is a protagonist?","choices":["The hero of the story","The villain in the story","The main character in a story","The narrator of the story"],"answer":2,"tag":"story"},{"type":"mc","q":"What is an antagonist?","choices":["The bad guy in the story","The good guy in the story","The person going against the protagonist","The person or thing going against the protagonist"],"answer":3,"tag":"story"},{"type":"mc","q":"Setting is...","choices":["When and where the story takes place, and the culture in the story","The time period of the story","The culture depicted in the story","Where the story takes place"],"answer":0,"tag":"story"},{"type":"mc","q":"Which of the following is the best example of sensory detail?","choices":["The book was filled with complex characters and intricate plotlines.","As I stepped outside, the scent of dried leaves and wood smoke tickling my nose.","She was a kind and generous person.","He decided to take a different route to work that day."],"answer":1,"tag":"figurative"},{"type":"mc","q":"What is an anecdote in writing?","choices":["A detailed description of a character's appearance","A short, informal story used to illustrate a point or convey a message","A formal, in-depth analysis of a topic","A summary of the main events in a story"],"answer":1,"tag":"nonfiction"},{"type":"mc","q":"Which of the following is an example of an anecdote?","choices":["The sun was shining brightly, and the birds were singing in the trees.","She had long, flowing hair that cascaded down her back like a waterfall.","\"I once met a man who told me he hadn't watched television in 20 years. He said he found more fulfillment in reading and engaging with the world around him.\""],"answer":2,"tag":"nonfiction"},{"type":"mc","q":"What is imagery in writing?","choices":["The repetition of initial consonant sounds in a series of words","The use of vivid, descriptive language to appeal to the reader's senses","The literal meaning of a word","A figure of speech that compares two unlike things using \"like\" or \"as\""],"answer":1,"tag":"figurative"},{"type":"mc","q":"Which of the following is an example of a euphemism?","choices":["The flowers danced in the gentle breeze.","He \"passed away\" last night. (instead of \"died\")","The stars twinkled like diamonds in the night sky.","She was as hungry as a wolf."],"answer":1,"tag":"figurative"},{"type":"mc","q":"What is connotation?","choices":["The literal, dictionary definition of a word","comparison between two things using \"like\" or \"as\"","The emotions, associations, or ideas that a word evokes beyond its literal meaning","The repetition of consonant sounds within a word or phrase"],"answer":2,"tag":"devices"},{"type":"mc","q":"What is denotation?","choices":["The act of writing","The dictionary definition of a word","A direct comparison","The figurative meaning of a word"],"answer":1,"tag":"devices"},{"type":"mc","q":"Which of the following is an example of alliteration?","choices":["Her voice was as sweet as honey.","The slithering snake silently slipped through the grass.","The sun smiled down on the blooming flowers.","The old book smelled like musty memories and forgotten dreams."],"answer":1,"tag":"sound"},{"type":"mc","q":"What is personification?","choices":["The literal, dictionary definition of a word","A figure of speech in which human qualities are attributed to non-human things","The use of words that imitate sounds","A comparison between two things using \"like\" or \"as\""],"answer":1,"tag":"figurative"},{"type":"mc","q":"What is apostrophe as a literary device?","choices":["A punctuation mark used to show possession or contraction","A figure of speech in which a speaker directly addresses an absent or nonliving person, place, or thing","A comparison between two unlike things using \"like\" or \"as\"","The repetition of vowel sounds in a series of words"],"answer":1,"tag":"devices"},{"type":"mc","q":"What is the mood of a literary work?","choices":["The author's attitude toward the subject or audience","The underlying meaning or main idea of a literary work","The emotional atmosphere or overall feeling a work conveys to the reader","The time and place in which a story occurs"],"answer":2,"tag":"devices"},{"type":"mc","q":"Which of the following best describes the tone of a literary work?","choices":["The author's attitude toward the subject, characters, or audience","The underlying meaning or main idea of a literary work","The emotional atmosphere or overall feeling a work conveys to the reader","The time and place in which a story occurs"],"answer":0,"tag":"devices"},{"type":"mc","q":"What is the setting of a story?","choices":["The emotional atmosphere or overall feeling a work conveys to the reader","The author's attitude toward the subject, characters, or audience","The underlying meaning or main idea of a literary work","The time and place in which a story occurs"],"answer":3,"tag":"story"},{"type":"mc","q":"What is a theme in literature?","choices":["The emotional atmosphere or overall feeling a work conveys to the reader","The use of vivid, descriptive language to appeal to the reader's senses","The time and place in which a story occurs","The underlying meaning or main idea of a literary work"],"answer":3,"tag":"story"},{"type":"mc","q":"What is an allusion in literature?","choices":["The repetition of consonant sounds within a word or phrase","A comparison between two unlike things using \"like\" or \"as\"","The use of words that imitate sounds","A reference to a well-known person, place, event, literary work, or work of art"],"answer":3,"tag":"devices"},{"type":"mc","q":"Which of the following is an example of onomatopoeia?","choices":["The bees buzzed and hummed as they flew from flower to flower.","The stars twinkled like diamonds in the night sky.","The old book smelled like musty memories and forgotten dreams.","The wind whispered secrets through the rustling leaves."],"answer":0,"tag":"sound"},{"type":"mc","q":"What is hyperbole?","choices":["The repetition of consonant sounds within a word or phrase","An exaggerated statement or claim not meant to be taken literally","A comparison between two unlike things using \"like\" or \"as\"","A figure of speech in which human qualities are attributed to non-human things"],"answer":1,"tag":"figurative"},{"type":"mc","q":"Which of the following is an example of hyperbole?","choices":["The old book smelled like musty memories and forgotten dreams.","I've told you a million times to clean your room!","The wind whispered secrets through the rustling leaves.","The stars twinkled like diamonds in the night sky."],"answer":1,"tag":"figurative"},{"type":"mc","q":"What is assonance?","choices":["The repetition of consonant sounds within a word or phrase","The repetition of vowel sounds in a series of words","A comparison between two unlike things using \"like\" or \"as\"","An exaggerated statement or claim not meant to be taken literally"],"answer":1,"tag":"sound"},{"type":"mc","q":"Which of the following is an example of assonance?","choices":["Peter Piper picked a peck of pickled peppers.","The old book smelled like musty memories and forgotten dreams.","The stars twinkled like diamonds in the night sky.","The breeze blew through the trees, whispering secrets to the leaves."],"answer":3,"tag":"sound"},{"type":"mc","q":"What is a simile?","choices":["A comparison between two unlike things using \"like\" or \"as\"","A figure of speech in which human qualities are attributed to non-human things","An exaggerated statement or claim not meant to be taken literally","The repetition of consonant sounds within a word or phrase"],"answer":0,"tag":"figurative"},{"type":"mc","q":"Which of the following is an example of a simile?","choices":["The sun was a golden orb in the sky.","The old book smelled like musty memories and forgotten dreams.","The wind whispered secrets through the rustling leaves.","Her voice was as sweet as honey."],"answer":3,"tag":"figurative"},{"type":"mc","q":"What is a metaphor?","choices":["The repetition of consonant sounds within a word or phrase","A direct comparison of two unlike things without using \"like\" or \"as\"","A comparison between two unlike things using \"like\" or \"as\"","An exaggerated statement or claim not meant to be taken literally"],"answer":1,"tag":"figurative"},{"type":"mc","q":"Which of the following is an example of a metaphor?","choices":["The old book smelled like musty memories and forgotten dreams.","Her smile was as bright as the sun.","Life is a rollercoaster, full of ups and downs.","The stars twinkled like diamonds in the night sky."],"answer":2,"tag":"figurative"},{"type":"mc","q":"What are the three main purposes of nonfiction literature?","choices":["To describe, to narrate, and to explain","To persuade, to inform, and to explain","To entertain, to persuade, and to inform","To analyze, to interpret, and to evaluate"],"answer":1,"tag":"nonfiction"},{"type":"mc","q":"Which purpose of nonfiction literature involves convincing the reader to agree with a particular viewpoint or take a specific action?","choices":["To entertain","To persuade","To explain","To inform"],"answer":1,"tag":"nonfiction"},{"type":"mc","q":"When a nonfiction text aims to provide facts, details, and evidence about a topic, which purpose is being fulfilled?","choices":["To inform","To analyze","To explain","To persuade"],"answer":0,"tag":"nonfiction"},{"type":"mc","q":"Which purpose of nonfiction literature focuses on making complex ideas or processes clearer and easier to understand?","choices":["To persuade","To explain","To evaluate","To inform"],"answer":1,"tag":"nonfiction"},{"type":"mc","q":"Which type of nonfiction literature presents an account of a person's life written by that person?","choices":["Essay","Memoir","Autobiography","Biography"],"answer":2,"tag":"nonfiction"},{"type":"mc","q":"What is a biography?","choices":["An account of a person's life written by that person","A short, non-fictional piece that explores a specific topic or idea","An account of a person's life written by someone else","A collection of personal stories and reflections written by an individual"],"answer":2,"tag":"nonfiction"},{"type":"mc","q":"What is a memoir?","choices":["A collection of personal stories and reflections written by an individual","An account of a person's life written by that person","An account of a person's life written by someone else","A short, non-fictional piece that explores a specific topic or idea"],"answer":0,"tag":"nonfiction"},{"type":"mc","q":"What is objective writing?","choices":["Writing that uses figurative language and vivid descriptions","Writing that relies heavily on emotional appeals to engage the reader","Writing that expresses personal opinions, feelings, and biases","Writing that presents factual information without bias or personal opinions"],"answer":3,"tag":"nonfiction"},{"type":"mc","q":"What is subjective writing?","choices":["Writing that relies heavily on logical appeals and evidence","Writing that expresses personal opinions, feelings, and biases","Writing that presents factual information without bias or personal opinions","Writing that uses a formal tone and complex language"],"answer":1,"tag":"nonfiction"},{"type":"mc","q":"Why is it important to verify the accuracy of nonfiction texts?","choices":["To ensure that the information presented is up-to-date","To make the text more subjective and opinionated","To ensure that the information presented is factual and reliable","To make the text more engaging and interesting for the reader"],"answer":2,"tag":"nonfiction"},{"type":"mc","q":"What is ethos in nonfiction literature?","choices":["An appeal to logic and reason","An appeal to emotions and feelings","An appeal to the author's credibility, expertise, or character","An appeal to the reader's imagination"],"answer":2,"tag":"nonfiction"},{"type":"mc","q":"Which of the following best describes why ethos is important in nonfiction literature?","choices":["It ensures that the information presented is up-to-date","It helps establish trust between the author and the reader","It makes the text more subjective and opinionated","It makes the text more engaging and interesting for the reader"],"answer":1,"tag":"nonfiction"},{"type":"mc","q":"What is logos?","choices":["An appeal to emotions and feelings","An appeal to logic, reason, and evidence","An appeal to the author's credibility, expertise, or character","An appeal to the reader's imagination"],"answer":1,"tag":"nonfiction"},{"type":"mc","q":"Which of the following best describes why logos is important in nonfiction literature?","choices":["It helps establish trust between the author and the reader","It makes the text more engaging and interesting for the reader","It makes the text more subjective and opinionated","It supports the author's claims with facts and evidence"],"answer":3,"tag":"nonfiction"},{"type":"mc","q":"What is pathos?","choices":["An appeal to the author's credibility, expertise, or character","An appeal to the reader's imagination","An appeal to logic, reason, and evidence","An appeal to emotions and feelings"],"answer":3,"tag":"nonfiction"},{"type":"mc","q":"Which of the following best describes why pathos is important in nonfiction literature?","choices":["It supports the author's claims with facts and evidence","It ensures that the information presented is factual and reliable","It engages the reader emotionally and helps create a connection with the text","It helps establish trust between the author and the reader"],"answer":2,"tag":"nonfiction"},{"type":"mc","q":"What is objective writing?","choices":["A short, non-fictional piece that explores a specific topic or idea","When writers screen out any feelings and simply convey facts","An account of a person's life written by that person","A collection of personal stories and reflections written by an individual"],"answer":1,"tag":"nonfiction"},{"type":"mc","q":"What is a stanza in poetry?","choices":["The rhythmic structure of a poem","The repetition of initial consonant sounds in a series of words","The pattern of rhyme at the end of each line","A grouped set of lines within a poem, often separated by a blank line"],"answer":3,"tag":"sound"},{"type":"mc","q":"What is a rhyme scheme in poetry?","choices":["The pattern of rhyme at the end of each line","The rhythmic structure of a poem","The repetition of initial consonant sounds in a series of words","A grouped set of lines within a poem, often separated by a blank line"],"answer":0,"tag":"sound"},{"type":"mc","q":"What is meter in poetry?","choices":["The repetition of initial consonant sounds in a series of words","A grouped set of lines within a poem, often separated by a blank line","The rhythmic structure of a poem","The pattern of rhyme at the end of each line"],"answer":2,"tag":"sound"},{"type":"mc","q":"Which of the following is an example of an opinion?","choices":["The Eiffel Tower is located in Paris, France.","The Earth is the third planet from the Sun.","Water boils at 100 degrees Celsius at sea level.","Chocolate is the best flavor of ice cream."],"answer":3,"tag":"nonfiction"},{"type":"mc","q":"Which of the following is an example of an emotional appeal?","choices":["According to a recent study, this product has been proven to be 50% more effective than its competitors.","The company has a long history of producing high-quality products and providing excellent customer service.","Imagine the joy on your child's face when you bring home this amazing toy - don't miss out on those precious memories.","This product is the most cost-effective solution for your needs, as it offers the best value for your money."],"answer":2,"tag":"nonfiction"},{"type":"mc","q":"Which of the following is an example of a fact?","choices":["The Mona Lisa was painted by Leonardo da Vinci.","Everyone should see the Mona Lisa at least once in their life.","The Mona Lisa evokes feelings of mystery and intrigue.","The Mona Lisa is the most beautiful painting in the world."],"answer":0,"tag":"nonfiction"},{"type":"mc","q":"Which of the following is an example of a loaded word?","choices":["Tree","Villain","Chair","House"],"answer":1,"tag":"nonfiction"},{"type":"mc","q":"Which of the following is an example of a logical appeal?","choices":["Studies have shown that this product is 50% more effective than its competitors.","As a doctor with 20 years of experience, I highly recommend this product to my patients.","This product is the best choice because it's the most popular one on the market.","Imagine the joy on your child's face when you bring home this amazing toy - don't miss out on creating those precious memories."],"answer":0,"tag":"nonfiction"},{"type":"mc","q":"Which of the following is an example of an ethical appeal?","choices":["This product is the most cost-effective solution for your needs, as it offers the best value for your money.","By choosing our eco-friendly product, you'll be doing your part to help protect the environment for future generations.","Imagine the joy on your child's face when you bring home this amazing toy - don't miss out on creating those memories.","Studies have shown that this product is 50% more effective than its competitors."],"answer":1,"tag":"nonfiction"},{"type":"mc","q":"What is a run-on sentence?","choices":["A sentence that is too short and lacks a subject or a verb","Two or more independent clauses that are not properly joined with punctuation or a coordinating conjunction","A sentence that contains a subordinate clause","A sentence that is too long but is grammatically correct"],"answer":1,"tag":"grammar"},{"type":"mc","q":"Which of the following is an example of a run-on sentence?","choices":["She loves to read mystery novels.","Although he was tired, he decided to keep working.","I went to the store I bought some groceries.","The cat slept on the couch, and the dog napped on the rug."],"answer":2,"tag":"grammar"},{"type":"mc","q":"What is a sentence fragment?","choices":["A sentence that is grammatically correct but lacks clarity","A sentence that contains a subordinate clause","A sentence that is too long and contains too many clauses","An incomplete sentence that lacks a subject, a verb, or both and does not express a complete thought"],"answer":3,"tag":"grammar"},{"type":"mc","q":"Which of the following is an example of a sentence fragment?","choices":["The book that I borrowed from the library is due next week.","I'm looking forward to the weekend because I plan to relax and catch up on sleep.","She always drinks coffee in the morning.","Because he missed the bus."],"answer":3,"tag":"grammar"},{"type":"mc","q":"Which of the following is an example of fiction?","choices":["A news article about a recent scientific discovery","A textbook about the American Revolution","A novel about a magical world filled with dragons and wizards","A biography of Abraham Lincoln"],"answer":2,"tag":"nonfiction"},{"type":"mc","q":"Which of the following is an example of nonfiction?","choices":["A memoir about a person's life experiences","A fantasy novel set in a distant galaxy","A short story about a talking animal","A science fiction story about time travel"],"answer":0,"tag":"nonfiction"},{"type":"mc","q":"Why is identifying the main idea important in reading comprehension?","choices":["It makes reading more challenging and time-consuming","It is not important and can be skipped when reading","It helps the reader understand and remember the most important information in a text","It helps the reader focus on minor details and ignore the overall message"],"answer":2,"tag":"nonfiction"},{"type":"mc","q":"Which of the following best describes the main idea of a text?","choices":["The central message or key point that the author wants to convey","A random fact that is unrelated to the overall topic","A minor detail that is mentioned briefly in the passage","The longest sentence in the text"],"answer":0,"tag":"nonfiction"},{"type":"mc","q":"Which of the following is the correct format for an MLA in-text citation?","choices":["(Author LastName, PublicationYear, Page Number)","(Author Last Name Page Number)","(Author LastName, Page Number)","(Author FirstName LastName, Page Number)"],"answer":1,"tag":"writing"},{"type":"mc","q":"Which of the following sentences demonstrates the correct use of commas?","choices":["The dog, ran quickly, to catch the ball.","The recipe requires flour eggs sugar and butter.","I enjoy hiking; swimming and camping.","After finishing the project, the team celebrated their success."],"answer":3,"tag":"devices"}];

  <script>
/* data/pedigrees.js — real pedigree-chart practice for Biology (bio-pedigree).
   These are normal authored MC questions that carry a `fig` (an SVG pedigree)
   rendered above the stem by QUIZ. Standard pedigree conventions:
     square = male, circle = female, shaded = shows the trait,
     horizontal line = a mating pair, vertical line down = their children.
   Appended via addAuthored, so they get fresh bio-pedigree ids and never touch
   existing progress. */
(function (STUDY) {
  "use strict";
  if (!STUDY || typeof STUDY.addAuthored !== "function") return;

  const INK = "#34406b";       // outline + connector colour
  const FILL = "#34406b";      // shaded = shows the trait

  // ---- tiny SVG pedigree builder -------------------------------------------
  function square(x, y, shaded, id) {
    let s = "<rect x='" + (x - 13) + "' y='" + (y - 13) + "' width='26' height='26' " +
            "fill='" + (shaded ? FILL : "#fff") + "' stroke='" + INK + "' stroke-width='2.5'/>";
    if (id) s += label(x, y + 27, id);
    return s;
  }
  function circle(x, y, shaded, id) {
    let s = "<circle cx='" + x + "' cy='" + y + "' r='14' " +
            "fill='" + (shaded ? FILL : "#fff") + "' stroke='" + INK + "' stroke-width='2.5'/>";
    if (id) s += label(x, y + 28, id);
    return s;
  }
  function label(x, y, t) {
    return "<text x='" + x + "' y='" + y + "' font-size='10.5' text-anchor='middle' " +
           "fill='#555' font-family='system-ui'>" + t + "</text>";
  }
  function gen(x, y, t) {
    return "<text x='" + x + "' y='" + y + "' font-size='12' text-anchor='middle' " +
           "fill='#999' font-family='system-ui' font-weight='700'>" + t + "</text>";
  }
  function line(x1, y1, x2, y2) {
    return "<line x1='" + x1 + "' y1='" + y1 + "' x2='" + x2 + "' y2='" + y2 +
           "' stroke='" + INK + "' stroke-width='2'/>";
  }
  function legend(w, y) {
    return "<text x='" + (w / 2) + "' y='" + y + "' font-size='10' text-anchor='middle' " +
           "fill='#777' font-family='system-ui'>shaded = shows the trait · □ male · ○ female</text>";
  }
  function svg(w, h, body) {
    return "<svg viewBox='0 0 " + w + " " + h + "' xmlns='http://www.w3.org/2000/svg'>" +
           "<rect width='" + w + "' height='" + h + "' rx='12' fill='#f7f8fc'/>" + body + "</svg>";
  }

  // ---- Pedigree A: two unaffected parents, one affected child (recessive) ----
  const PED_A = svg(260, 205,
    gen(20, 50, "I") + gen(20, 112, "II") +
    // generation I (parents), neither shaded
    square(95, 46, false, "I-1") + circle(165, 46, false, "I-2") +
    line(108, 46, 151, 46) +              // mating line
    line(130, 46, 130, 78) +              // drop to sibship
    // sibship bar to the two children
    line(100, 78, 160, 78) +
    line(100, 78, 100, 95) + line(160, 78, 160, 95) +
    // generation II (children): II-1 affected
    square(100, 108, true, "II-1") + circle(160, 108, false, "II-2") +
    legend(260, 196));

  // ---- Pedigree B: trait skips a generation (3 generations, recessive) -------
  const PED_B = svg(260, 215,
    gen(18, 46, "I") + gen(18, 100, "II") + gen(18, 154, "III") +
    // generation I: affected grandfather x unaffected grandmother
    square(110, 42, true, "I-1") + circle(180, 42, false, "I-2") +
    line(123, 42, 166, 42) +              // mating line
    line(145, 42, 145, 82) +              // straight drop to single child II-1
    // generation II: daughter (carrier) x her spouse (known carrier)
    circle(145, 96, false, "II-1") + square(205, 96, false, "II-2") +
    line(159, 96, 192, 96) +              // mating line
    line(175, 96, 175, 124) +             // drop to sibship
    line(150, 124, 200, 124) +
    line(150, 124, 150, 137) + line(200, 124, 200, 137) +
    // generation III: one affected child
    square(150, 150, true, "III-1") + circle(200, 150, false, "III-2") +
    legend(260, 206));

  STUDY.addAuthored("bio-pedigree", [
    // ---- Pedigree A questions ----
    { type: "mc", fig: PED_A, lvl: 2, concept: "recessive-read",
      q: "Parents I-1 and I-2 do NOT show the trait, but their son II-1 DOES. The trait must be:",
      choices: ["dominant", "recessive", "impossible to inherit", "passed only from the mother"], answer: 1,
      explain: "Two unaffected parents with an affected child means the trait is recessive (it was hidden in both parents)." },
    { type: "mc", fig: PED_A, lvl: 2, concept: "carrier-read",
      q: "Since neither parent shows the trait yet their child does, the genotypes of I-1 and I-2 must both be:",
      choices: ["TT (homozygous dominant)", "Tt (carriers)", "tt (affected)", "one TT and one tt"], answer: 1,
      explain: "Each parent had to carry a hidden recessive allele to pass it on, so both are Tt carriers." },
    { type: "mc", fig: PED_A, lvl: 2, concept: "genotype-read",
      q: "Individual II-1 is the shaded square and shows the recessive trait. Its genotype is:",
      choices: ["TT", "Tt", "tt", "cannot be determined"], answer: 2,
      explain: "A recessive trait only appears with two recessive alleles, so II-1 is tt." },
    { type: "mc", fig: PED_A, lvl: 1, concept: "symbol-read",
      q: "In this chart, II-1 is drawn as a shaded SQUARE. That tells you II-1 is a:",
      choices: ["female who shows the trait", "male who shows the trait", "female carrier", "male who does not show the trait"], answer: 1,
      explain: "Square = male; shaded = shows the trait." },
    // ---- Pedigree B questions ----
    { type: "mc", fig: PED_B, lvl: 2, concept: "carrier-infer",
      q: "Grandfather I-1 is shaded, so he is affected (tt). His daughter II-1 is unshaded. Because she had to receive a recessive allele from him, II-1's genotype must be:",
      choices: ["TT", "Tt (carrier)", "tt", "cannot be determined"], answer: 1,
      explain: "An affected father (tt) gives every child one t. II-1 doesn't show the trait, so she is Tt, a carrier." },
    { type: "mc", fig: PED_B, lvl: 2, concept: "cross-prob",
      q: "II-1 (Tt) marries II-2, who is also a known carrier (Tt). What is the chance that any one of their children SHOWS the recessive trait?",
      choices: ["0%", "25%", "50%", "75%"], answer: 1,
      explain: "Tt × Tt = 1 TT : 2 Tt : 1 tt, so 25% are tt and show the trait." },
    { type: "mc", fig: PED_B, lvl: 2, concept: "skip-pattern",
      q: "The trait shows up in generation I and generation III but skips generation II. This skipping pattern is a classic sign of a ___ trait.",
      choices: ["dominant", "recessive", "male-only", "newly mutated"], answer: 1,
      explain: "Recessive traits can hide in carriers for a generation, then reappear, so they often skip generations." },
  ]);
})(window.STUDY);

  <script>
/* ============================================================
   quizgen.js, expands the question bank at load time so practice
   can't be pattern-memorised. Runs AFTER all data files (and
   data/extra.js) register, BEFORE quiz/test/app.
     1. Card → MC (every subject): self-contained questions whose
        distractors are real, same-subject answers of similar length.
     2. Geometry: ~20 randomised numeric problem types.
     3. French: randomised conjugation drills (conditionnel/futur).
   Geometry & French builders take an RNG so a seed can reproduce an
   identical test on another device (see test.js share links).
   ============================================================ */
(function (STUDY) {
  "use strict";
  const shuffle0 = STUDY.SRS.shuffle;                 // Math.random based
  // rng-parameterised helpers (rng() -> [0,1))
  const ri = (rng, a, b) => a + Math.floor(rng() * (b - a + 1));
  const rp = (rng, arr) => arr[Math.floor(rng() * arr.length)];
  function rsh(rng, a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  const r2 = (x) => Math.round(x * 100) / 100;
  const r1 = (x) => Math.round(x * 10) / 10;
  const PI = Math.PI;

  function norm(s) { return String(s).toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim(); }
  function wordset(s) { return new Set(norm(s).split(" ").filter(w => w.length > 3)); }
  function sim(a, b) { const A = wordset(a), B = wordset(b); if (!A.size || !B.size) return 0; let i = 0; A.forEach(w => { if (B.has(w)) i++; }); return i / (A.size + B.size - i); }

  /* ---------------- 1. card → multiple choice ---------------- */
  function stemFor(front) {
    const f = front.trim();
    if (/[?…:=]$/.test(f)) return f;
    if (/^(what|which|who|where|when|why|how|name|put|list|define|conjugate|cross|select|identify)\b/i.test(f)) return f;
    return "Which best describes “" + f.replace(/[.…\s]+$/, "") + "”?";
  }
  function genFromCards() {
    STUDY.subjects.forEach(function (s) {
      const all = [];
      s.topics.forEach(t => (t.cards || []).forEach(c => all.push({ c: c, t: t })));
      if (all.length < 4) return;

            if (x.c === card) return false;

          // other Verona characters as wrong options, not an essay-writing definition.

          if (new Set(choices.map(norm)).size < 4) return;

          existing[norm(stem)] = 1;
        });
        if (add.length) STUDY.addQuestions(t, add);
      });
    });
  }

  /* ---------------- 2. geometry numeric problems ---------------- */
  function numMC(rng, stem, correct, distractors, fmt, explain) {

    const choices = rsh(rng, four).map(fmt);

  const GEO = [

    ["geo-area", r => { const a = ri(r, 4, 14), b = a + ri(r, 2, 10), h = ri(r, 3, 12); return numMC(r, "A trapezoid has parallel sides " + a + " and " + b + " with height " + h + ". Area?", 0.5 * (a + b) * h, [(a + b) * h, 0.5 * a * b, a + b + h], v => "" + r1(v), "Area of a trapezoid = ½(b₁+b₂)×h = ½(" + a + "+" + b + ")×" + h + " = " + r1(0.5 * (a + b) * h) + "."); }],

    ["geo-solids", r => { const l = ri(r, 3, 12), w = ri(r, 3, 12), h = ri(r, 3, 12); return numMC(r, "A rectangular prism is " + l + " by " + w + " by " + h + ". What is its volume?", l * w * h, [2 * (l * w + l * h + w * h), l + w + h, l * w + l * h + w * h], v => v + " units³", "Volume of a prism = l × w × h = " + l + " × " + w + " × " + h + " = " + (l * w * h) + " units³."); }],

    ["geo-solids", r => { const rd = ri(r, 2, 9); return numMC(r, "A sphere has radius " + rd + ". Volume = (4/3)πr³ ≈ ? (π ≈ 3.14)", r1(4 / 3 * PI * rd * rd * rd), [r1(4 * PI * rd * rd), r1(4 / 3 * PI * rd * rd), r1(PI * rd * rd * rd)], v => "" + r1(v), "Volume of a sphere = (4/3)πr³ = (4/3) × 3.14 × " + rd + "³ ≈ " + r1(4 / 3 * PI * rd * rd * rd) + "."); }],

    ["geo-solids", r => { const l = ri(r, 3, 10), w = ri(r, 3, 10), h = ri(r, 3, 10); return numMC(r, "A rectangular prism is " + l + " by " + w + " by " + h + ". What is its surface area?", 2 * (l * w + l * h + w * h), [l * w * h, l + w + h, l * w + l * h + w * h], v => v + " units²", "SA of a prism = 2(lw+lh+wh) = 2(" + (l * w) + "+" + (l * h) + "+" + (w * h) + ") = " + (2 * (l * w + l * h + w * h)) + " units²."); }],

    ["geo-righttri", r => { const a = ri(r, 3, 18), b = ri(r, 3, 18); return numMC(r, "A right triangle has legs " + a + " and " + b + ". What is the hypotenuse? (round to 0.01)", r2(Math.hypot(a, b)), [a + b, Math.max(a, b), r2(Math.sqrt(Math.abs(a * a - b * b)) || a)], v => "" + r2(v), "Pythagorean theorem: c = √(a²+b²) = √(" + a + "²+" + b + "²) = √" + (a * a + b * b) + " ≈ " + r2(Math.hypot(a, b)) + "."); }],

    ["geo-righttri", r => { const leg = ri(r, 3, 14); return numMC(r, "A 45-45-90 triangle has legs of " + leg + ". What is the hypotenuse? (leg·√2, round to 0.01)", r2(leg * Math.SQRT2), [2 * leg, r2(leg * Math.sqrt(3)), r2(leg / Math.SQRT2)], v => "" + r2(v), "In a 45-45-90 triangle, hypotenuse = leg × √2 = " + leg + " × 1.414 ≈ " + r2(leg * Math.SQRT2) + "."); }],

  function geometryItems(rng, per) {
    const out = [];
    GEO.forEach(function (pair) {
      for (let i = 0; i < per; i++) {
        let it = null, tr = 0;
        while (!it && tr++ < 6) it = pair[1](rng);
        if (it) { it.topic = pair[0]; out.push(it); }

    });

  }

    const byTopic = {};
    geometryItems(rng, per).forEach(it => { const tp = it.topic; delete it.topic; (byTopic[tp] = byTopic[tp] || []).push(it); });

  }

  /* ---------------- 3. french conjugation drills ---------------- */
  const FR_VERBS = [
    { inf: "parler", stem: "parler" }, { inf: "regarder", stem: "regarder" }, { inf: "manger", stem: "manger" },
    { inf: "aimer", stem: "aimer" }, { inf: "travailler", stem: "travailler" }, { inf: "écouter", stem: "écouter" },
    { inf: "donner", stem: "donner" }, { inf: "jouer", stem: "jouer" },
    { inf: "finir", stem: "finir" }, { inf: "choisir", stem: "choisir" }, { inf: "vendre", stem: "vendr" },
    { inf: "prendre", stem: "prendr" }, { inf: "attendre", stem: "attendr" },
    { inf: "aller", stem: "ir" }, { inf: "avoir", stem: "aur" }, { inf: "être", stem: "ser" },
    { inf: "faire", stem: "fer" }, { inf: "pouvoir", stem: "pourr" }, { inf: "devoir", stem: "devr" },
    { inf: "voir", stem: "verr" }, { inf: "venir", stem: "viendr" }, { inf: "vouloir", stem: "voudr" },

    { inf: "visiter", stem: "visiter" }, { inf: "habiter", stem: "habiter" }, { inf: "voyager", stem: "voyager" },

    const out = [], seen = {};

      const v = rp(rng, FR_VERBS), si = ri(rng, 0, 5), tense = rng() < 0.5 ? "cond" : "fut";

      out.push({ topic: tense === "cond" ? "fr-conditionnel" : "fr-futur", type: "mc",

    const byTopic = {};
    const push = it => { const tp = it.topic; delete it.topic; (byTopic[tp] = byTopic[tp] || []).push(it); };
    frenchItems(rng, mcCount).forEach(push);

    Object.keys(byTopic).forEach(function (tid) { const e = STUDY.topicIndex[tid]; if (e) STUDY.addQuestions(e.topic, byTopic[tid]); });
  }

  try { genFromCards(); } catch (e) { if (window.console) console.warn("card-gen", e); }

  STUDY.QUIZGEN = { genFromCards: genFromCards, geometryItems: geometryItems, frenchItems: frenchItems };

  <script>

(function (STUDY) {

  <script>
/* ============================================================
   quiz.js, interactive question + flashcard runner
   Question shapes:
     {type:'mc',   q, choices:[...], answer:<index>, explain}
     {type:'fill', q, answers:['accepted', ...], explain, placeholder}
     {type:'tf',   q, answer:true|false, explain}
     {type:'match',q, pairs:[{left,right}], explain}
   ============================================================ */
(function (STUDY) {
  "use strict";
  const SRS = STUDY.SRS;
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function norm(s) {
    return String(s || "")
      .toLowerCase().trim()
      .normalize("NFD").replace(/[̀-ͯ]/g, "")  // strip accents
      .replace(/[’']/g, "")
      .replace(/[^a-z0-9]+/g, " ").trim();
  }

  const QUIZ = {};

  function toast(msg) {
    const t = document.getElementById("toast");
    if (!t) return;
    t.textContent = msg; t.classList.add("show");
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1400);
  }
  QUIZ.toast = toast;

  /* ---------------- text-to-speech (French listening / oral practice) ---------------- */
  QUIZ.canSpeak = (typeof window !== "undefined" && "speechSynthesis" in window);
  QUIZ.speak = function (text, lang) {
    if (!QUIZ.canSpeak) return;
    try {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(String(text).replace(/[*_`«»]/g, "").trim());
      u.lang = lang || "fr-FR"; u.rate = 0.92;
      const want = (lang || "fr").slice(0, 2).toLowerCase();
      const v = (window.speechSynthesis.getVoices() || []).find(x => x.lang && x.lang.toLowerCase().slice(0, 2) === want);
      if (v) u.voice = v;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  };
  QUIZ.speakerBtn = function (text, lang, cls) {
    const b = el("button", "spk" + (cls ? " " + cls : ""), "🔊");
    b.type = "button"; b.title = "Hear it";
    b.onclick = function (e) { e.stopPropagation(); e.preventDefault(); QUIZ.speak(text, lang); };
    return b;
  };
  // some browsers load voices async
  if (QUIZ.canSpeak && typeof window.speechSynthesis.getVoices === "function") {
    try { window.speechSynthesis.getVoices(); window.speechSynthesis.onvoiceschanged = function () { window.speechSynthesis.getVoices(); }; } catch (e) {}
  }

  /* ---------------- lenient answer matching (typos & wording OK, offline) ---------------- */
  function lev(a, b) {
    a = a || ""; b = b || ""; const m = a.length, n = b.length;
    if (!m) return n; if (!n) return m;
    let prev = new Array(n + 1), cur = new Array(n + 1);
    for (let j = 0; j <= n; j++) prev[j] = j;
    for (let i = 1; i <= m; i++) {
      cur[0] = i;
      for (let j = 1; j <= n; j++) { const c = a[i - 1] === b[j - 1] ? 0 : 1; cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + c); }
      const t = prev; prev = cur; cur = t;
    }
    return prev[n];
  }
  function tokens(s) { return norm(s).split(" ").filter(w => w.length > 2); }
  // ---- numeric answers (math) get NUMERIC comparison, not text typo-matching,
  // so "78.5 cm²" is accepted for "78.5" but "12" is NOT accepted for "120".
  function firstNum(s) { if (s == null) return null; const m = String(s).replace(/,/g, "").match(/[-+]?\d*\.?\d+/); return m ? parseFloat(m[0]) : null; }
  function isNumericAnswer(s) {
    if (s == null) return false;
    const t = String(s).trim().replace(/,/g, "");
    const m = t.match(/^[-+]?\d*\.?\d+/); if (!m) return false;
    const rest = t.slice(m[0].length).replace(/[\s²³°^]/g, "").replace(/\b(squared|cubed|sq|cm|mm|m|km|in|ft|yd|units?|u|pi|π|deg|degrees?|rad)\b/gi, "").replace(/π/g, "");
    return rest === "";                                   // a number plus only units/symbols
  }
  function numericClose(input, accepted) {
    const u = firstNum(input), a = firstNum(accepted);
    if (u === null || a === null) return false;
    const ds = String(accepted).match(/\.(\d+)/), dec = ds ? ds[1].length : 0;
    if (dec === 0) return Math.round(u) === Math.round(a);          // integer answer: exact to the unit
    const f = Math.pow(10, dec);
    if (Math.round(u * f) === Math.round(a * f)) return true;        // matches at the answer's precision
    return Math.abs(u - a) / Math.max(Math.abs(a), 1) <= 0.005;      // slack for π (3.14 vs 3.14159) & rounding
  }
  function fuzzyMatch(input, accepted) {
    const list = accepted || [];
    // numeric path first: any numeric accepted answer is judged by value
    for (let i = 0; i < list.length; i++) { if (isNumericAnswer(list[i]) && numericClose(input, list[i])) return true; }
    const v = norm(input); if (!v) return false;
    return list.map(function (x) { return { raw: x, n: norm(x) }; }).some(function (o) {
      const a = o.n; if (!a) return false;

      const tol = a.length <= 4 ? 1 : a.length <= 8 ? 2 : 3;          // typo tolerance
      if (lev(v, a) <= tol) return true;
      const A = new Set(tokens(a)), B = new Set(tokens(v));            // keyword overlap
      if (A.size >= 2 && B.size) {
        let i = 0; A.forEach(w => { if (B.has(w)) i++; });
        if (i >= 2 && (i / A.size >= 0.5 || i / B.size >= 0.6)) return true; // your key words are mostly right
      }
      return false;
    });
  }
  QUIZ.fuzzyMatch = fuzzyMatch;

  /* ---------------- "explain why I'm wrong" (offline, from lesson content) ---------------- */
  function topicDefs(topicId) {
    const e = STUDY.topicIndex[topicId]; if (!e) return [];
    const out = [];
    (e.topic.lesson || []).forEach(function (b) {
      if (b.term) out.push([b.term, b.def]);
      else if (b.defs) b.defs.forEach(p => out.push([p[0], p[1]]));
    });
    return out;
  }
  function explainFor(q) {
    if (!q) return null;
    if (q.explain) return q.explain;
    const ans = q.type === "mc" ? (q.choices ? q.choices[q.answer] : "") : (q.answers ? q.answers[0] : "");
    const defs = topicDefs(q.topicId);
    const stemN = norm(q.q || "");
    for (let k = 0; k < defs.length; k++) { const t = defs[k][0], d = defs[k][1]; if (t && stemN.indexOf(norm(t)) >= 0) return t + ": " + String(d).replace(/\*\*/g, ""); }
    if (ans) for (let k = 0; k < defs.length; k++) { const t = defs[k][0], d = defs[k][1]; if (d && norm(d).indexOf(norm(ans)) >= 0) return "Correct because this matches " + t + "."; }
    return null;
  }
  QUIZ.explainFor = explainFor;

  /* ---------------- shared feedback block (used by Practice & Cram) ---------------- */
  function buildFeedback(ok, correctText, q, extraHtml) {
    const fb = el("div", "explain " + (ok ? "ok" : "no"));
    fb.appendChild(el("span", "v", ok ? "✓ Correct" : "✗ Not quite"));
    let body = "";
    if (!ok && correctText) body += "<b>Answer:</b> " + esc(correctText) + "<br>";
    const ex = explainFor(q);
    if (ex) body += "<span class='why'>" + esc(ex) + "</span>";
    if (extraHtml) body += (body ? "<br>" : "") + extraHtml;
    if (body) fb.insertAdjacentHTML("beforeend", body);
    if (q && q.id && STUDY.CROWD && STUDY.CROWD.stat) {
      const cs = STUDY.CROWD.stat(q.id);   // only show when it's really a crowd (>=2 people), not just you
      if (cs && cs.learners >= 2 && cs.n >= 5) fb.appendChild(el("div", "crowd-line", "👥 " + Math.round(cs.rate * 100) + "% of students get this one right"));
    }
    if (q && q.subjectId === "french" && correctText && QUIZ.canSpeak) { fb.appendChild(document.createElement("br")); fb.appendChild(QUIZ.speakerBtn(correctText, "fr-FR")); }
    if (q && (q.topicId && STUDY.topicIndex[q.topicId] || q.id)) {
      const row = el("div", "row"); row.style.marginTop = "9px";
      if (q.topicId && STUDY.topicIndex[q.topicId]) {
        // wrong → nudge the lesson; right → keep it available but quiet
        const lb = el("button", "btn sm" + (ok ? " ghost" : " good"), ok ? "📖 Review lesson" : "📖 Learn why");
        lb.onclick = function () {
          if (STUDY.showLesson) STUDY.showLesson(q.topicId, q.id);   // inline overlay, stays in the session
          else if (STUDY.go) STUDY.go("#/t/" + q.topicId + "/learn");
        };
        row.appendChild(lb);
      }
      if (q.id) {
        const star = el("button", "btn sm ghost", STUDY.isStarred(q.id) ? "★ Starred" : "☆ Star");
        star.onclick = function () { const on = STUDY.toggleStar(q.id); star.textContent = on ? "★ Starred" : "☆ Star"; };
        row.appendChild(star);
        const rep = el("button", "btn sm ghost", STUDY.isFlagged(q.id) ? "⚐ Reported" : "⚐ Report");
        rep.title = "Report a wrong or confusing question (we'll stop showing it)";
        rep.onclick = function () {
          if (STUDY.isFlagged(q.id)) { STUDY.unflag(q.id); rep.textContent = "⚐ Report"; toast("Un-reported"); }
          else { STUDY.flagItem(q.id, "user"); rep.textContent = "⚐ Reported"; toast("Thanks, we'll stop showing this one"); }
        };
        row.appendChild(rep);
      }
      fb.appendChild(row);
    }
    return fb;
  }
  QUIZ.buildFeedback = buildFeedback;

  /* ---------------- main quiz runner ---------------- */
  QUIZ.run = function (mount, questions, opts) {
    opts = opts || {};
    if (!questions || !questions.length) {
      mount.innerHTML = '<div class="empty"><div class="big">🎉</div>Nothing to practice here right now.</div>';
      if (opts.onDone) {/* still allow caller buttons */ }
      return;
    }
    const state = { i: 0, correct: 0, answered: 0, results: [], list: questions };
    const instant = opts.instant !== false;       // exam mode passes instant:false
    // exam mode auto-feeds mastery; snapshot the forecast so we can show the lift
    const examFc = function () { const A = STUDY.ADAPT; if (!A) return 0; return opts.examSubject && opts.examSubject !== "all" ? A.forecast(opts.examSubject) : A.overallForecast(); };
    if (opts.mode === "exam") state.startFc = examFc();
    let remain = opts.timeLimit || 0, ticker = null, timerEl = null;

    function startTimer() {
      if (!opts.timeLimit || ticker) return;
      ticker = setInterval(function () {
        remain--;
        paintTimer();
        if (remain <= 0) { stopTimer(); results(true); }
      }, 1000);
    }
    function stopTimer() { if (ticker) { clearInterval(ticker); ticker = null; } }
    function paintTimer() {
      if (!timerEl) return;
      const m = Math.floor(remain / 60), s = remain % 60;
      timerEl.textContent = "⏱ " + m + ":" + String(s).padStart(2, "0");
      timerEl.className = "exam-timer" + (remain <= 30 ? " danger" : remain <= 90 ? " warn" : "");
    }

    function render() {
      const q = state.list[state.i];
      state.t0 = Date.now();                 // start the response-time clock for this question
      mount.innerHTML = "";
      // progress
      const top = el("div", "q-top");
      const pr = el("div", "q-progress");
      pr.appendChild(el("i")).style.width = ((state.i) / state.list.length * 100) + "%";
      top.appendChild(pr);
      if (opts.timeLimit) { timerEl = el("div", "exam-timer"); paintTimer(); top.appendChild(timerEl); }
      top.appendChild(el("div", "q-count", (state.i + 1) + " / " + state.list.length));
      mount.appendChild(top);
      startTimer();

      const subj = STUDY.byId[q.subjectId];
      const topic = STUDY.topicIndex[q.topicId] ? STUDY.topicIndex[q.topicId].topic : null;
      if (opts.showTags !== false && subj) {
        mount.appendChild(el("div", "q-kicker", esc(subj.name) + (topic ? " · " + esc(topic.title) : "")));
      }

      // optional figure (e.g. a pedigree chart) shown above the stem. q.fig is
      // trusted authored SVG markup, never user input.
      if (q.fig) { const f = el("div", "q-fig"); f.innerHTML = q.fig; mount.appendChild(f); }

      if (q.type === "match") return renderMatch(q);
      if (q.type === "listen") return renderListen(q);
      if (q.type === "fill") return renderFill(q);
      if (q.type === "tf") return renderTF(q);
      return renderMC(q);
    }

    /* ----- listening comprehension (audio prompt, MC answer) ----- */
    function renderListen(q) {
      const bar = el("div", "row"); bar.style.cssText = "margin-bottom:14px;align-items:center;gap:11px";
      bar.appendChild(QUIZ.speakerBtn(q.say, "fr-FR", "big"));
      bar.appendChild(el("div", "muted", "🎧 Listen, then answer. Tap 🔊 to replay."));
      mount.appendChild(bar);
      if (QUIZ.canSpeak) setTimeout(function () { QUIZ.speak(q.say, "fr-FR"); }, 280);
      mount.appendChild(el("h2", "q-stem", esc(q.q || "What did you hear?")));
      const order = SRS.shuffle(q.choices.map((_, i) => i));
      const wrap = el("div", "choices"); const btns = [];
      order.forEach(function (oi, n) {
        const c = el("button", "choice");
        c.appendChild(el("span", "key", String.fromCharCode(65 + n)));
        c.appendChild(el("span", "ct", esc(q.choices[oi])));
        c.onclick = function () { choose(oi, c); };
        wrap.appendChild(c); btns.push(c);
      });
      mount.appendChild(wrap);
      function choose(oi, node) {
        const ok = oi === q.answer; btns.forEach(b => b.disabled = true);
        if (!instant) { node.classList.add("selected"); commit(q, ok ? 2 : 0, ok); if (state.i + 1 < state.list.length) setTimeout(function () { state.i++; render(); window.scrollTo(0, 0); }, 180); else nextBar(); return; }
        btns.forEach(function (b, k) { if (order[k] === q.answer) b.classList.add("correct"); else if (b === node) b.classList.add("wrong"); else b.classList.add("dim"); });
        mount.appendChild(feedbackBlock(ok, q.choices[q.answer], q));
        commit(q, ok ? 2 : 0, ok); nextBar();
      }
    }

    const feedbackBlock = buildFeedback;   // (ok, correctText, q, extraHtml)

    function advanceBar() {
      // grow the top progress bar after answering
      const bar = mount.querySelector(".q-progress > i");
      if (bar) bar.style.width = ((state.i + 1) / state.list.length * 100) + "%";
    }

    function commit(q, grade, ok, chosen) {
      // Route through the same engine as the For You feed so practice/review/cram
      // answers capture response time → fast/confident answers earn higher mastery
      // AND higher memory-stability (better retention), instead of being capped at
      // "good". Also updates your ability rating from practice, not just the feed.
      const rt = state.t0 ? Math.max(0, Date.now() - state.t0) : 0;
      STUDY.ADAPT.update(q, ok, rt, false, opts.mode || "practice", typeof chosen === "number" ? chosen : undefined, opts.level || 0);
      state.answered++;
      if (ok) state.correct++;
      state.results.push({ q: q, ok: ok });
      advanceBar();
    }

    function nextBar(extra) {
      const bar = el("div", "qbar");
      const b = el("button", "btn primary", (state.i + 1 < state.list.length ? "Next →" : "See results"));
      b.onclick = function () {
        if (state.i + 1 < state.list.length) { state.i++; render(); window.scrollTo(0, 0); }
        else results();
      };
      if (extra) bar.appendChild(extra);
      bar.appendChild(b);
      mount.appendChild(b._wrap = bar);
      b.focus();
    }

    /* ----- multiple choice ----- */
    function renderMC(q) {
      if (STUDY.varyGenerated) STUDY.varyGenerated(q);          // vary distractors (generated items)
      mount.appendChild(el("h2", "q-stem", esc(q.q)));
      // reshuffle positions every serve so the answer slot can't be memorised
      const order = SRS.shuffle(q.choices.map((_, i) => i));
      const wrap = el("div", "choices");
      const btns = [];
      order.forEach(function (origIdx, n) {
        const c = el("button", "choice");
        c.appendChild(el("span", "key", String.fromCharCode(65 + n)));
        c.appendChild(el("span", "ct", esc(q.choices[origIdx])));
        c.dataset.orig = origIdx;
        c.onclick = function () { choose(origIdx, c); };
        wrap.appendChild(c); btns.push(c);
      });
      mount.appendChild(wrap);

      function choose(origIdx, node) {
        const ok = origIdx === q.answer;
        btns.forEach(function (b) { b.disabled = true; });
        document.onkeydown = null;
        if (!instant) {                    // exam mode: just mark the pick, no reveal
          node.classList.add("selected");
          commit(q, ok ? 2 : 0, ok, origIdx);
          if (state.i + 1 < state.list.length) { setTimeout(function () { state.i++; render(); window.scrollTo(0, 0); }, 180); }
          else nextBar();
          return;
        }
        btns.forEach(function (b) {
          const oi = +b.dataset.orig;
          if (oi === q.answer) b.classList.add("correct");
          else if (b === node) b.classList.add("wrong");
          else b.classList.add("dim");
        });
        mount.appendChild(feedbackBlock(ok, q.choices[q.answer], q));
        commit(q, ok ? 2 : 0, ok, origIdx);
        nextBar();
      }

      // keyboard a-d / 1-4
      document.onkeydown = function (e) {
        const k = e.key.toLowerCase();
        let idx = -1;
        if (k >= "1" && k <= "9") idx = +k - 1;
        else if (k >= "a" && k <= "z") idx = k.charCodeAt(0) - 97;
        if (idx >= 0 && idx < btns.length && !btns[idx].disabled) { e.preventDefault(); btns[idx].click(); }
      };
    }

    /* ----- true / false ----- */
    function renderTF(q) {
      mount.appendChild(el("h2", "q-stem", esc(q.q)));
      const wrap = el("div", "choices");
      [["True", true], ["False", false]].forEach(function (pair, n) {
        const c = el("button", "choice");
        c.appendChild(el("span", "key", String.fromCharCode(65 + n)));
        c.appendChild(el("span", "ct", pair[0]));
        c.onclick = function () {
          const ok = pair[1] === q.answer;
          Array.from(wrap.children).forEach(function (b) { b.disabled = true; });
          if (!instant) {
            c.classList.add("selected"); commit(q, ok ? 2 : 0, ok);
            if (state.i + 1 < state.list.length) setTimeout(function () { state.i++; render(); window.scrollTo(0, 0); }, 180); else nextBar();
            return;
          }
          c.classList.add(ok ? "correct" : "wrong");
          mount.appendChild(feedbackBlock(ok, q.answer ? "True" : "False", q));
          commit(q, ok ? 2 : 0, ok); nextBar();
        };
        wrap.appendChild(c);
      });
      mount.appendChild(wrap);
    }

    /* ----- fill in the blank ----- */
    function renderFill(q) {
      mount.appendChild(el("h2", "q-stem", esc(q.q)));
      const row = el("div", "fill-in");
      const inp = el("input");
      inp.type = "text"; inp.autocomplete = "off"; inp.autocapitalize = "off"; inp.spellcheck = false;
      inp.placeholder = q.placeholder || "Type your answer…";
      const go = el("button", "btn primary", "Check");
      row.appendChild(inp); row.appendChild(go);
      mount.appendChild(row);
      inp.focus();

      let done = false;
      function check() {
        if (done) return;
        const val = norm(inp.value);
        if (!val) { inp.focus(); return; }
        const ok = fuzzyMatch(inp.value, q.answers);
        done = true; inp.disabled = true; go.disabled = true;
        if (!instant) {
          inp.classList.add("selected"); commit(q, ok ? 2 : 0, ok);
          if (state.i + 1 < state.list.length) setTimeout(function () { state.i++; render(); window.scrollTo(0, 0); }, 160); else nextBar();
          return;
        }
        inp.classList.add(ok ? "correct" : "wrong");
        mount.appendChild(feedbackBlock(ok, (q.answers || [])[0], q));
        commit(q, ok ? 2 : 0, ok);
        // let the user override self-grade (lenient subject matter)
        const extra = el("div", "row");
        if (!ok) {
          const mark = el("button", "btn sm good", "I was right →");
          mark.onclick = function () { STUDY.recordItem(q.id, 2, q.topicId, { mode: opts.mode || "practice" }); state.correct++; state.results[state.results.length - 1].ok = true; mark.remove(); toast("Counted as correct"); };
          extra.appendChild(mark);
        }
        nextBar(extra.children.length ? extra : null);
      }
      go.onclick = check;
      inp.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); done ? (mount.querySelector(".qbar .primary") || {}).click && mount.querySelector(".qbar .primary").click() : check(); } };
    }

    /* ----- matching ----- */
    function renderMatch(q) {
      mount.appendChild(el("h2", "q-stem", esc(q.q || "Match each item to its pair.")));
      const lefts = q.pairs.map(p => p.left);
      const rights = SRS.shuffle(q.pairs.map(p => p.right));
      const grid = el("div", "match-grid");
      const selects = [];
      lefts.forEach(function (lf, i) {
        const r = el("div", "match-row");
        r.appendChild(el("div", "ml", esc(lf)));
        const sel = el("select");
        sel.appendChild(el("option", null, "choose…")).value = "";
        rights.forEach(function (rt) { const o = el("option", null, esc(rt)); o.value = rt; sel.appendChild(o); });
        r.appendChild(sel); grid.appendChild(r);
        selects.push(sel);
      });
      mount.appendChild(grid);
      const check = el("button", "btn primary full", "Check matches");
      check.style.marginTop = "12px";
      mount.appendChild(check);
      check.onclick = function () {
        let allOk = true;
        selects.forEach(function (sel, i) {
          const want = q.pairs[i].right;
          const ok = sel.value === want;
          sel.classList.add(ok ? "correct" : "wrong");
          sel.disabled = true;
          if (!ok) { allOk = false; const o = Array.from(sel.options).find(o => o.value === want); }
        });
        check.disabled = true;
        const detail = allOk ? "" : "Correct pairs:<br>" + q.pairs.map(p => "• " + esc(p.left) + " → " + esc(p.right)).join("<br>");
        mount.appendChild(feedbackBlock(allOk, "", q, detail));
        commit(q, allOk ? 2 : 0, allOk);
        nextBar();
      };
    }

    /* ----- results ----- */
    function results(timedOut) {
      stopTimer();
      document.onkeydown = null;
      mount.innerHTML = "";
      if (timedOut) mount.appendChild(el("div", "q-kicker", "⏱ Time's up"));
      const pct = Math.round(state.correct / state.list.length * 100);
      const big = el("div", "result-big");
      big.appendChild(el("div", "score", pct + "%"));
      big.appendChild(el("div", "lbl", state.correct + " of " + state.list.length + " correct"));
      mount.appendChild(big);

      const bar = el("div", "scorebar");
      const g = el("div", "s-good"); g.style.flex = state.correct || 0.0001;
      const b = el("div", "s-bad"); b.style.flex = (state.list.length - state.correct) || 0.0001;
      bar.appendChild(g); bar.appendChild(b); mount.appendChild(bar);

      // exam mode: confirm every answer fed your mastery, and show the forecast lift
      if (opts.mode === "exam") {
        const newFc = examFc(), d = newFc - (state.startFc != null ? state.startFc : newFc);
        const sub = opts.examSubject && opts.examSubject !== "all" ? ((STUDY.byId[opts.examSubject] || {}).name || "subject") : "finals";
        const fc = el("div", "feed-gain");
        fc.innerHTML = "✓ Every answer was logged to your mastery. <b>🔮 " + esc(sub) + " forecast: " + newFc + "%</b>"
          + (d > 0 ? " <span style='color:var(--good)'>▲ +" + d + "</span>" : d < 0 ? " <span class='muted'>" + d + "</span>" : "");
        mount.appendChild(fc);
      }

      // review wrong ones
      const wrong = state.results.filter(r => !r.ok);
      if (wrong.length) {
        const p = el("div", "panel");
        p.appendChild(el("div", "vcap", "Flagged for review (" + wrong.length + ")"));
        wrong.forEach(function (r) {
          const line = el("div");
          line.style.cssText = "padding:6px 0;border-top:1px solid var(--line);font-size:.9rem";
          let ans = r.q.type === "mc" ? r.q.choices[r.q.answer] : (r.q.answers ? r.q.answers[0] : (r.q.answer === true ? "True" : r.q.answer === false ? "False" : ""));
          const why = explainFor(r.q);
          line.innerHTML = "<b>" + esc(r.q.q) + "</b><br><span class='muted'>✓ " + esc(ans || "") + "</span>" + (why ? "<br><span class='why' style='font-size:.85rem'>" + esc(why) + "</span>" : "");
          p.appendChild(line);
        });
        mount.appendChild(p);
      } else if (state.list.length > 2) {
        mount.appendChild(el("div", "panel center", "🔥 Clean sweep! Every answer correct."));
      }

      const bar2 = el("div", "qbar");
      if (wrong.length) {
        const again = el("button", "btn", "Retry missed (" + wrong.length + ")");
        again.onclick = function () { QUIZ.run(mount, SRS.shuffle(wrong.map(r => r.q)), opts); };
        bar2.appendChild(again);
      }
      const done = el("button", "btn primary", opts.doneLabel || "Done");
      done.onclick = function () { if (opts.onDone) opts.onDone(state); };
      bar2.appendChild(done);
      mount.appendChild(bar2);
      if (opts.onResults) opts.onResults(state);
    }

    render();
  };

  /* ---------------- flashcard runner ---------------- */
  QUIZ.runCards = function (mount, cards, opts) {
    opts = opts || {};
    if (!cards || !cards.length) { mount.innerHTML = '<div class="empty">No flashcards here.</div>'; return; }
    const list = SRS.shuffle(cards);
    let i = 0;

    function render() {
      const c = list[i];
      mount.innerHTML = "";
      const top = el("div", "q-top");
      const pr = el("div", "q-progress"); pr.appendChild(el("i")).style.width = (i / list.length * 100) + "%";
      top.appendChild(pr); top.appendChild(el("div", "q-count", (i + 1) + " / " + list.length));
      mount.appendChild(top);

      const subj = STUDY.byId[c.subjectId];

      const krow = el("div", "row"); krow.style.alignItems = "center";
      if (subj) krow.appendChild(el("div", "q-kicker", esc(subj.name) + (topic ? " · " + esc(topic.title) : "")));
      krow.appendChild(el("div", "spacer"));
      if (c.id) { const star = el("button", "btn sm ghost", STUDY.isStarred(c.id) ? "★" : "☆"); star.title = "Bookmark"; star.onclick = function (e) { e.stopPropagation(); star.textContent = STUDY.toggleStar(c.id) ? "★" : "☆"; }; krow.appendChild(star); }
      mount.appendChild(krow);

      const lang = c.subjectId === "french" ? "fr-FR" : "en-US";
      function addSpeaker(face, text) {
        if (!QUIZ.canSpeak) return;
        const sp = QUIZ.speakerBtn(text, lang);
        sp.style.cssText = "position:absolute;top:10px;right:12px";
        face.appendChild(sp);
      }
      const flash = el("div", "flash");
      const inner = el("div", "inner");
      const front = el("div", "face");
      front.appendChild(el("div", "lbl", "Prompt"));
      front.appendChild(el("div", "ct", esc(c.front)));
      if (c.hint) front.appendChild(el("div", "hint", "Hint: " + esc(c.hint)));
      addSpeaker(front, c.front);
      const back = el("div", "face back");
      back.appendChild(el("div", "lbl", "Answer"));
      back.appendChild(el("div", "ct", esc(c.back)));
      addSpeaker(back, c.back);
      inner.appendChild(front); inner.appendChild(back);
      flash.appendChild(inner);
      mount.appendChild(flash);
      if (opts.audio && c.subjectId === "french") QUIZ.speak(c.front, "fr-FR");
      mount.appendChild(el("div", "flash-hint", "Tap the card (or press Space) to flip"));

      let flipped = false;
      function flip() {
        flipped = !flipped;
        flash.classList.toggle("flipped", flipped);
        rate.style.display = flipped ? "grid" : "none";
        hintBar.style.display = flipped ? "none" : "block";
      }
      flash.onclick = flip;

      const hintBar = mount.querySelector(".flash-hint");
      const rate = el("div", "rate");
      rate.style.display = "none";
      [["Again", "again", 0], ["Hard", "hard", 1], ["Good", "good", 2], ["Easy", "easy", 3]].forEach(function (r) {
        const intervalTxt = r[2] === 0 ? "soon" : humanHours(STUDY.predictStabilityHours(c.id, r[2]));
        const b = el("button", r[1], r[0] + "<small>" + intervalTxt + "</small>");
        b.onclick = function (e) { e.stopPropagation(); STUDY.recordItem(c.id, r[2], c.topicId, { mode: "flashcard" }); next(); };
        rate.appendChild(b);
      });

  function humanInterval(ms) {
    if (!ms) return "";

  /* ---------------- "For You" adaptive feed ----------------

  QUIZ.runFeed = function (mount, opts) {

    const subjName = opts.subjectId ? ((STUDY.byId[opts.subjectId] || {}).name || "") : "";
    const ready = function () { return opts.subjectId ? ADAPT.readiness(opts.subjectId) : ADAPT.overallReadiness(); };

    function statusBar() {

    }

    function proceed(q, ok, rt, guessed, chosen) {
      const wasMastered = STUDY.itemMastery(q.id) >= 0.55;
      ADAPT.update(q, ok, rt, guessed, opts.subjectId ? "feed_subj" : "feed", chosen);
      if (!wasMastered && STUDY.itemMastery(q.id) >= 0.55) mastered++;   // crossed into "known" this set

      big.appendChild(el("div", "lbl", (subjName ? esc(subjName) + " ready" : "finals ready") + (delta > 0 ? "  ▲ +" + delta : "") + " · " + correct + "/" + answered + " this set"));

      if (tired) mount.appendChild(el("div", "panel center", "😮‍💨 Your accuracy dipped, a 2-minute breather actually helps memory stick. Keep going, or pick it up later?"));
      else mount.appendChild(el("div", "panel center", "Nice momentum. The feed keeps adapting to exactly what you need next."));
      const bar = el("div", "qbar");
      const go = el("button", "btn primary", tired ? "Push on" : "Keep going");
      go.onclick = function () { render(); window.scrollTo(0, 0); };
      const done = el("button", "btn", "Done for now");
      done.onclick = function () { if (opts.onDone) opts.onDone(); };
      bar.appendChild(go); bar.appendChild(done); mount.appendChild(bar);
    }

    function actionsRow(q, ok, rtState) {
      const row = el("div", "row"); row.style.marginTop = "8px";
      if (ok) {
        const g = el("button", "btn sm ghost", "🤔 I guessed");
        g.onclick = function () { rtState.guessed = !rtState.guessed; g.classList.toggle("on", rtState.guessed); g.textContent = rtState.guessed ? "✓ counted as a guess" : "🤔 I guessed"; };

    }
    function nextRow(q, ok, rt, rtState, chosen) {
      const bar = el("div", "qbar");
      const b = el("button", "btn primary", "Next →");
      b.onclick = function () { document.onkeydown = null; proceed(q, ok, rt, rtState.guessed, chosen); };

    }

    function renderItem(q, t0) {
      const rtState = { guessed: false };
      if (q.type === "listen") {
        const ab = el("div", "row"); ab.style.cssText = "margin-bottom:13px;align-items:center;gap:11px";
        ab.appendChild(QUIZ.speakerBtn(q.say, "fr-FR", "big"));
        ab.appendChild(el("div", "muted", "🎧 Listen, then answer."));
        mount.appendChild(ab);

      }
      mount.appendChild(el("h2", "q-stem", esc(q.q || "What did you hear?")));

        const rowi = el("div", "fill-in"); const inp = el("input"); inp.type = "text"; inp.autocomplete = "off"; inp.spellcheck = false; inp.placeholder = "Type your answer…";
        const go = el("button", "btn primary", "Check"); rowi.appendChild(inp); rowi.appendChild(go); mount.appendChild(rowi); inp.focus();

        function check() { if (done || !norm(inp.value)) return inp.focus && inp.focus(); const ok = fuzzyMatch(inp.value, q.answers); const rt = Date.now() - t0; done = true; inp.disabled = true; go.disabled = true; inp.classList.add(ok ? "correct" : "wrong"); mount.appendChild(buildFeedback(ok, (q.answers || [])[0], q)); const a = actionsRow(q, ok, rtState); if (!ok) { const m = el("button", "btn sm good", "I was right →"); m.onclick = function () { m.remove(); proceed(q, true, rt, false); }; a.appendChild(m); } if (a.children.length) mount.appendChild(a); nextRow(q, ok, rt, rtState); }

      else { const order = SRS.shuffle(q.choices.map((_, i) => i)); opts2 = order.map(i => [q.choices[i], i]); ansIdx = q.answer; }
      const wrap = el("div", "choices"); const btns = [];
      opts2.forEach(function (pair, n) {
        const c = el("button", "choice");
        c.appendChild(el("span", "key", String.fromCharCode(65 + n)));
        c.appendChild(el("span", "ct", esc(pair[0])));
        c.onclick = function () {

          const rt = Date.now() - t0;

      document.onkeydown = function (e) { const k = e.key.toLowerCase(); let idx = -1; if (k >= "1" && k <= "9") idx = +k - 1; else if (k >= "a" && k <= "z") idx = k.charCodeAt(0) - 97; if (idx >= 0 && idx < btns.length && !btns[idx].disabled) { e.preventDefault(); btns[idx].click(); } };
    }

    render();
  };

  /* ---------------- image-occlusion diagram runner ----------------
     Shows a diagram with every label hidden; you recall each part
     (typed, lenient) one at a time. */
  QUIZ.runDiagram = function (mount, diagram, opts) {
    opts = opts || {};
    const order = SRS.shuffle(diagram.parts.map((_, i) => i));
    const answered = {};
    let pos = 0, correct = 0;

    function markers(box, activeIdx) {
      diagram.parts.forEach(function (p, idx) {
        const m = el("div", "dmark");
        m.style.left = p.x + "%"; m.style.top = p.y + "%";

      const top = el("div", "q-top"); const pr = el("div", "q-progress"); pr.appendChild(el("i")).style.width = (pos / order.length * 100) + "%";
      top.appendChild(pr); top.appendChild(el("div", "q-count", (pos + 1) + " / " + order.length)); mount.appendChild(top);
      mount.appendChild(el("div", "q-kicker", "🗺️ " + esc(diagram.title)));
      const box = el("div", "diagram-box"); box.innerHTML = diagram.svg; markers(box, idx); mount.appendChild(box);
      mount.appendChild(el("h2", "q-stem", "What is the highlighted (?) part?"));
      const row = el("div", "fill-in"); const inp = el("input"); inp.type = "text"; inp.autocomplete = "off"; inp.spellcheck = false; inp.placeholder = "Type the part name…";
      const go = el("button", "btn primary", "Check"); row.appendChild(inp); row.appendChild(go); mount.appendChild(row);
      const rev = el("button", "btn sm ghost", "Reveal answer"); rev.style.marginTop = "8px"; mount.appendChild(rev);
      inp.focus();
      let done = false;
      function settle(ok) {
        if (done) return; done = true; inp.disabled = true; go.disabled = true; rev.disabled = true;
        answered[idx] = part.label; if (ok) correct++;
        STUDY.recordItem("diagram:" + diagram.id + "#" + idx, ok ? 2 : 0, diagram.topicId, { mode: "diagram" });
        inp.classList.add(ok ? "correct" : "wrong");
        const fb = el("div", "explain " + (ok ? "ok" : "no"));
        fb.appendChild(el("span", "v", ok ? "✓ Correct" : "✗ It's the " + part.label));
        if (part.note) fb.insertAdjacentHTML("beforeend", esc(part.note));
        mount.appendChild(fb);
        const bar = el("div", "qbar"); const nb = el("button", "btn primary", pos + 1 < order.length ? "Next part →" : "See results");
        nb.onclick = function () { pos++; render(); window.scrollTo(0, 0); }; bar.appendChild(nb); mount.appendChild(bar); nb.focus();
      }
      go.onclick = function () { if (!norm(inp.value)) return inp.focus(); settle(QUIZ.fuzzyMatch(inp.value, [part.label].concat(part.aliases || []))); };

      mount.innerHTML = "";
      const pct = Math.round(correct / order.length * 100);
      mount.appendChild(el("div", "result-big", "<div class='score'>" + pct + "%</div><div class='lbl'>" + correct + " of " + order.length + " labels recalled</div>"));
      const box = el("div", "diagram-box"); box.innerHTML = diagram.svg;
      diagram.parts.forEach(function (p) { const m = el("div", "dmark done lbl"); m.style.left = p.x + "%"; m.style.top = p.y + "%"; m.textContent = p.label; box.appendChild(m); });
      mount.appendChild(box);
      const bar = el("div", "qbar");
      const again = el("button", "btn", "Label again"); again.onclick = function () { QUIZ.runDiagram(mount, diagram, opts); };
      const done = el("button", "btn primary", opts.doneLabel || "Done"); done.onclick = function () { if (opts.onDone) opts.onDone(); };
      bar.appendChild(again); bar.appendChild(done); mount.appendChild(bar);
    }

  };

  /* ---------------- CRAM mode ----------------
     Research-backed last-minute drilling: massed RETRIEVAL practice with
     immediate feedback, items interleaved, missed items requeued to come
     back SOON, and each item "locked in" only after 2 correct in a row
     (a criterion / Leitner-drop). You keep cycling until everything is
     locked, so weak items get the most reps. */
  QUIZ.runCram = function (mount, items, opts) {
    opts = opts || {};
    const pool = (items || []).filter(q => q.type === "mc" || q.type === "fill" || q.type === "tf");
    if (!pool.length) { mount.innerHTML = '<div class="empty">Nothing to cram here yet.</div>'; return; }
    const DROP = opts.dropAfter || 2;
    const total = pool.length;
    const cc = {}, locked = {};
    let queue = SRS.interleave(pool.slice());
    let lockedCount = 0, answered = 0, correct = 0;

    function nextItem() { while (queue.length && locked[queue[0].id]) queue.shift(); return queue[0] || null; }
    function requeue(q, dist) { queue.shift(); queue.splice(Math.min(queue.length, dist), 0, q); }

    function after(q, ok) {
      answered++; if (ok) correct++;
      STUDY.recordItem(q.id, ok ? 2 : 0, q.topicId, { mode: "cram" });
      if (ok) {
        cc[q.id] = (cc[q.id] || 0) + 1;
        if (cc[q.id] >= DROP) { locked[q.id] = true; lockedCount++; queue.shift(); toast("🔒 Locked in"); }
        else requeue(q, 5 + Math.floor(Math.random() * 3));
      } else { cc[q.id] = 0; requeue(q, 2 + Math.floor(Math.random() * 2)); }
      if (lockedCount >= total) finish(); else { render(); window.scrollTo(0, 0); }
    }

    function render() {
      const q = nextItem();
      if (!q) return finish();
      mount.innerHTML = "";
      const stat = el("div", "cram-stat");
      const bar = el("div", "cram-locks"); bar.appendChild(el("i")).style.width = (lockedCount / total * 100) + "%";
      stat.appendChild(bar);
      stat.appendChild(el("div", "cram-num", "🔒 " + lockedCount + " / " + total));
      mount.appendChild(stat);
      const subj = STUDY.byId[q.subjectId], topic = STUDY.topicIndex[q.topicId] ? STUDY.topicIndex[q.topicId].topic : null;
      if (subj) mount.appendChild(el("div", "q-kicker", esc(subj.name) + (topic ? " · " + esc(topic.title) : "")));
      const cn = (cc[q.id] || 0);
      if (cn > 0) mount.appendChild(el("div", "cram-badge", "✓ once, get it again to lock it"));
      renderItem(q);
    }

    const feedback = function (ok, correctText, q, extra) { return buildFeedback(ok, correctText, q, extra); };
    function nextBtn(q, ok) {
      const bar = el("div", "qbar");
      const b = el("button", "btn primary", "Next →");
      b.onclick = function () { document.onkeydown = null; after(q, ok); };
      bar.appendChild(b); mount.appendChild(bar); b.focus();
    }

    function renderItem(q) {
      mount.appendChild(el("h2", "q-stem", esc(q.q)));
      if (q.type === "mc") {
        const order = SRS.shuffle(q.choices.map((_, i) => i));
        const wrap = el("div", "choices"); const btns = [];
        order.forEach(function (oi, n) {
          const c = el("button", "choice");
          c.appendChild(el("span", "key", String.fromCharCode(65 + n)));
          c.appendChild(el("span", "ct", esc(q.choices[oi])));
          c.onclick = function () {
            const ok = oi === q.answer;
            btns.forEach(function (b, k) { b.disabled = true; if (order[k] === q.answer) b.classList.add("correct"); else if (b === c) b.classList.add("wrong"); else b.classList.add("dim"); });
            mount.appendChild(feedback(ok, q.choices[q.answer], q));
            nextBtn(q, ok); document.onkeydown = null;
          };
          wrap.appendChild(c); btns.push(c);
        });
        mount.appendChild(wrap);
        document.onkeydown = function (e) { const k = e.key.toLowerCase(); let idx = -1; if (k >= "1" && k <= "9") idx = +k - 1; else if (k >= "a" && k <= "z") idx = k.charCodeAt(0) - 97; if (idx >= 0 && idx < btns.length && !btns[idx].disabled) { e.preventDefault(); btns[idx].click(); } };
      } else if (q.type === "tf") {
        const wrap = el("div", "choices");
        [["True", true], ["False", false]].forEach(function (pair) {
          const c = el("button", "choice"); c.appendChild(el("span", "ct", pair[0]));
          c.onclick = function () { const ok = pair[1] === q.answer; Array.from(wrap.children).forEach(b => b.disabled = true); c.classList.add(ok ? "correct" : "wrong"); mount.appendChild(feedback(ok, q.answer ? "True" : "False", q)); nextBtn(q, ok); };
          wrap.appendChild(c);
        });
        mount.appendChild(wrap);
      } else { // fill
        const row = el("div", "fill-in"); const inp = el("input"); inp.type = "text"; inp.autocomplete = "off"; inp.spellcheck = false; inp.placeholder = "Type your answer…";
        const go = el("button", "btn primary", "Check"); row.appendChild(inp); row.appendChild(go); mount.appendChild(row); inp.focus();
        let done = false;
        function check() {
          if (done) return; if (!norm(inp.value)) return inp.focus();
          const ok = fuzzyMatch(inp.value, q.answers);
          done = true; inp.disabled = true; go.disabled = true; inp.classList.add(ok ? "correct" : "wrong");
          mount.appendChild(feedback(ok, (q.answers || [])[0], q));
          const extra = el("div", "row");
          if (!ok) { const m = el("button", "btn sm good", "I was right →"); m.onclick = function () { m.remove(); after(q, true); }; extra.appendChild(m); }
          const bar = el("div", "qbar"); if (extra.children.length) bar.appendChild(extra);
          const b = el("button", "btn primary", "Next →"); b.onclick = function () { after(q, ok); }; bar.appendChild(b); mount.appendChild(bar); b.focus();
        }
        go.onclick = check; inp.onkeydown = function (e) { if (e.key === "Enter") { e.preventDefault(); if (!done) check(); } };
      }
    }

    function finish() {
      document.onkeydown = null;
      mount.innerHTML = "";
      mount.appendChild(el("div", "result-big", "<div class='score'>🔒</div><div class='lbl'>All " + total + " items locked in!</div>"));
      mount.appendChild(el("div", "panel center", "You answered " + answered + " times to lock " + total + " items (" + Math.round(correct / Math.max(1, answered) * 100) + "% first-try accuracy). That's the cram working: the ones you missed got the most reps."));
      const bar = el("div", "qbar");
      const again = el("button", "btn", "Cram again");
      again.onclick = function () { QUIZ.runCram(mount, items, opts); };
      const done = el("button", "btn primary", opts.doneLabel || "Done");
      done.onclick = function () { if (opts.onDone) opts.onDone(); };
      bar.appendChild(again); bar.appendChild(done); mount.appendChild(bar);
    }

    render();
  };

  QUIZ.norm = norm;
  STUDY.QUIZ = QUIZ;
})(window.STUDY);

  <script>
/* ============================================================
   test.js, randomized printable practice-test generator
   Builds a mock that mirrors each subject's real exam format,
   with a separate answer key. Re-roll = a brand-new test.
   ============================================================ */
(function (STUDY) {
  "use strict";
  const SRS = STUDY.SRS;
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const LET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

  // --- seeded RNG so a seed reproduces an identical test on any device ---
  function hashStr(s) { s = String(s); let h = 1779033703 ^ s.length; for (let i = 0; i < s.length; i++) { h = Math.imul(h ^ s.charCodeAt(i), 3432918353); h = (h << 13) | (h >>> 19); } return h >>> 0; }
